<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17283b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Собери монстра">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
<title>Собери монстра</title>
<style>
:root {
  --coral:#ff715f;
  --cream:#fff3df;
  --night:#17283b;
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
}
* { box-sizing:border-box; }
html,body {
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--night);color:white;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
*,*::before,*::after {
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button { font:inherit; -webkit-appearance:none; }
#game {
  position:relative;width:100%;height:100%;
  height:100dvh;overflow:hidden;
  background:linear-gradient(135deg,#142b3b,#202b46 55%,#392846);
}
canvas#field {
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;
}
.hud {
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 14px
    calc(env(safe-area-inset-bottom) + 16px);
  pointer-events:none;
}
.top { display:flex;justify-content:space-between;gap:10px; }
.stat {
  min-width:105px;padding:10px 13px;border-radius:17px;
  background:#172c42d9;border:1px solid #ffffff35;
  backdrop-filter:blur(12px);
}
.label {
  font-size:10px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:#b6c6d5;
}
.value {font-size:28px;font-weight:950;line-height:1.2}
.track {height:6px;background:#ffffff25;border-radius:8px;margin-top:7px;overflow:hidden}
#meter {height:100%;width:0;background:linear-gradient(90deg,#77d9bd,#ffd16d,#ff715f)}
.hint {
  align-self:center;text-align:center;padding:10px 15px;
  border-radius:30px;background:#17283bdc;border:1px solid #ffffff35;
  font-size:12px;max-width:95%;
}
.screen {
  position:absolute;inset:0;z-index:5;
  display:grid;place-items:center;padding:12px;
  background:#09121edb;backdrop-filter:blur(12px);
}
#intro.screen {
  display:block;padding:0;background:transparent;backdrop-filter:none;
}
#introArt {
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;display:block;
}
.intro-ui {
  position:relative;z-index:2;
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 22px) 22px calc(var(--sab) + 22px);
  box-sizing:border-box;
}
.intro-ui h1 {
  margin:0;text-align:center;
  font-size:clamp(52px,15vw,80px);line-height:.86;
  letter-spacing:-.07em;font-weight:900;color:#fff6e8;
  text-shadow:0 4px 0 #c84c43,0 12px 32px #00066;
  pointer-events:none;
}
.intro-stage {flex:1;width:100%;min-height:180px;pointer-events:none}
.intro-rules {
  margin:0 12px 16px;max-width:22em;text-align:center;
  font-size:15px;line-height:1.45;font-weight:650;color:#e7eef5;
  text-shadow:0 2px 14px #000a;
  pointer-events:none;
}
#intro .primary {
  width:min(100%,360px);padding:18px 28px;
  font-size:22px;border-radius:20px;margin-top:0;
  pointer-events:auto;
}
.hidden {display:none!important}
.panel {
  width:min(560px,100%);max-height:100%;
  overflow:auto;text-align:center;color:#243247;
  padding:clamp(20px,5vw,36px);border-radius:26px;
  background:linear-gradient(145deg,#fff8eb,#f1e3cf);
  box-shadow:0 25px 80px #0007;
}
.logo {
  width:68px;height:68px;margin:auto;border-radius:22px;
  display:grid;place-items:center;font-size:38px;
  background:#ffe5c4;
}
.kicker {font-size:10px;font-weight:950;letter-spacing:.2em;color:#df6a58}
h1 {font-size:clamp(44px,11vw,66px);line-height:.9;letter-spacing:-.06em;margin:12px 0}
h2 {font-size:clamp(28px,7vw,46px);line-height:1;margin:10px 0}
.panel p {font-size:14px;line-height:1.5;color:#617083}
.muted {font-size:12px!important;color:#8993a0!important}
.primary {
  display:inline-block;border:0;border-radius:16px;
  padding:15px 24px;margin-top:12px;
  background:linear-gradient(#ff806b,#f26052);
  color:white;font-size:17px;font-weight:900;
  box-shadow:0 5px 0 #c84c43,0 10px 24px #e65d4f44;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.primary:active {transform:translateY(3px);box-shadow:0 2px 0 #c84c43}
.primary:focus-visible {outline:3px solid #348bd2;outline-offset:4px}
.resultPanel {width:min(900px,100%);padding:14px}
#creature {
  display:block;width:100%;height:auto;
  aspect-ratio:600/700;
  max-height:min(52vh,520px);min-height:220px;
  border-radius:18px;background:#fff4e2;border:1px solid #fff;
}
.stamp {
  display:inline-block;padding:7px 12px;border-radius:30px;
  background:#21364a;color:white;font-size:10px;font-weight:900;
}
#legend {display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dot {width:12px;height:12px;border:2px solid white;border-radius:50%}
#animationNote {font-size:11px;color:#9b8066;min-height:16px}
@media(max-height:650px) {
  .panel {padding:14px}
  .logo {width:48px;height:48px;font-size:27px}
  h1 {font-size:42px}
  #creature {max-height:40vh;min-height:170px}
  .primary {padding:12px 20px}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="field"></canvas>

  <div class="hud hidden" id="hud">
    <div class="top">
      <div class="stat">
        <div class="label">Поймано</div>
        <div class="value"><span id="score">0</span> / 15</div>
        <div class="track"><div id="meter"></div></div>
      </div>
      <div class="stat" style="text-align:right">
        <div class="label">Время</div>
        <div class="value" id="timer">30</div>
      </div>
    </div>
    <div class="hint" id="hint">Лови детали — собери своего монстра!</div>
  </div>

  <section class="screen" id="intro">
    <canvas id="introArt"></canvas>
    <div class="intro-ui">
      <h1>Собери<br>монстра</h1>
      <div class="intro-stage" id="introStage" aria-hidden="true"></div>
      <p class="intro-rules">30 секунд. Лови детали — из них соберётся твой монстр.</p>
      <button class="primary" id="startBtn" type="button">Играть</button>
    </div>
  </section>

  <section class="screen hidden" id="result">
    <div class="panel resultPanel">
      <span class="stamp">Экземпляр создан</span>
      <span class="stamp" id="rarity">новый вид</span>
      <h2 id="creatureName">Неизвестный монстр</h2>
      <canvas id="creature" width="600" height="700"></canvas>
      <p id="creatureDesc"></p>
      <div id="legend"></div>
      <p id="animationNote">Собираем твоего монстра…</p>
      <button class="primary" id="againBtn" type="button">Собрать ещё монстра</button>
      <p class="muted">Из твоих деталей. Глазки — подарок от фабрики.</p>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const field = $('field');
const ctx = field.getContext('2d');
const creature = $('creature');
const cc = creature.getContext('2d');
const introCanvas=$('introArt');
const ic=introCanvas.getContext('2d');
let introRaf=0,introW=0,introH=0,introDpr=1,introFloaters=[];

const ROUND = 30, GOAL = 15;
const GEO = [
  {name:'круг',           roundness:1,   spikiness:0,    elongation:1},
  {name:'квадрат',        roundness:.35, spikiness:.15,  elongation:1},
  {name:'треугольник',    roundness:.2,  spikiness:.55,  elongation:1.1},
  {name:'звезда',         roundness:.12, spikiness:.95,  elongation:1},
  {name:'сердце',         roundness:.7,  spikiness:.12,  elongation:1.1},
  {name:'ромб',           roundness:.3,  spikiness:.4,   elongation:1.45},
  {name:'шестиугольник',  roundness:.55, spikiness:.2,   elongation:1},
  {name:'молния',         roundness:.08, spikiness:.85,  elongation:1.85},
  {name:'облако',         roundness:.88, spikiness:0,    elongation:1.35},
  {name:'пончик',         roundness:1,   spikiness:0,    elongation:1},
  {name:'крестик',        roundness:.18, spikiness:.5,   elongation:1},
  {name:'полумесяц',      roundness:.7,  spikiness:.18,  elongation:1.2},
  {name:'цветок',         roundness:.55, spikiness:.35,  elongation:1},
  {name:'пятиугольник',   roundness:.5,  spikiness:.25,  elongation:1},
  {name:'стрелка',        roundness:.12, spikiness:.6,   elongation:1.7}
];
const colors = ['#ff7564','#ffd16d','#70d4b4','#75c5f2',
 '#bd98ef','#f28eb5','#f39b43','#a5d85e'];

let w=0,h=0,dpr=1;
let targets=[],caught=[],sparks=[];
let running=false,elapsed=0,spawnClock=0,last=0,raf=0,resultRaf=0;
let pointerActive=true;

function cssPx(name) {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0;
}
function playBounds() {
  const top=Math.max(80, cssPx('--sat')+108);
  const bottom=Math.min(h-24, h-(cssPx('--sab')+70));
  return {
    left:16, right:w-16, top, bottom,
    cx:(16+w-16)/2, cy:(top+bottom)/2
  };
}

function resize() {
  w=window.innerWidth; h=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  field.width=Math.round(w*dpr);
  field.height=Math.round(h*dpr);
  field.style.width=w+'px';
  field.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  resizeIntro();
}
window.addEventListener('resize',resize);
resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function mulberry(seed) {
  let s=(seed>>>0)||1;
  return () => {
    s+=0x6D2B79F5;
    let t=Math.imul(s^(s>>>15),1|s);
    t^=t+Math.imul(t^(t>>>7),61|t);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function hash01(a,b){ return ((Math.imul((a+3)|0,0x45d9f3b)^(b*1103515245))>>>16)/65535; }

function ribbon(line, half) {
  const left=[], right=[];
  for(let i=0;i<line.length;i++){
    const p=line[i];
    const q=line[i<line.length-1?i+1:i-1];
    let dx=q[0]-p[0], dy=q[1]-p[1], len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*half, ny=dx/len*half;
    left.push([p[0]+nx,p[1]+ny]);
    right.push([p[0]-nx,p[1]-ny]);
  }
  return left.concat(right.reverse());
}
function normalizePts(pts) {
  let max=0.001;
  pts.forEach(p=>{ const d=Math.hypot(p[0],p[1]); if(d>max)max=d; });
  return pts.map(p=>[p[0]/max,p[1]/max]);
}

function makeKrako() {
  const seed=(Math.random()*0x7fffffff)|0;
  const r=mulberry(seed);
  const kind=pick(['blob','zigzag','worm','lumpy','spiky']);
  let pts, traits, smooth=false, label;
  if(kind==='blob'){
    const n=10+(r()*8|0), ph=r()*Math.PI*2;
    pts=[];
    for(let i=0;i<n;i++){
      const a=ph+i/n*Math.PI*2;
      const rad=.58+r()*.5;
      pts.push([Math.cos(a)*rad, Math.sin(a)*rad]);
    }
    traits={roundness:.72+r()*.22, spikiness:.08+r()*.22, elongation:.9+r()*.35};
    smooth=true;
    label=pick(['клякса','пузырь','капля','комок','пятно']);
  } else if(kind==='zigzag'){
    const segs=6+(r()*5|0), half=.16+r()*.12;
    const up=[], dn=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs, x=-1+t*2;
      const y=((i%2)?1:-1)*(.4+r()*.4);
      up.push([x,y+half]); dn.push([x,y-half]);
    }
    pts=up.concat(dn.reverse());
    traits={roundness:.1, spikiness:.55+r()*.25, elongation:1.55+r()*.5};
    label=pick(['зигзаг','излом','шеврон','ломаная']);
  } else if(kind==='worm'){
    const segs=8+(r()*7|0), amp=.22+r()*.38, freq=1.1+r()*2.2, thick=.15+r()*.14;
    const ph=r()*Math.PI*2, line=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      line.push([-0.98+t*1.96, Math.sin(t*freq*Math.PI*2+ph)*amp]);
    }
    pts=ribbon(line, thick);
    traits={roundness:.42, spikiness:.05+r()*.1, elongation:1.8+r()*.7};
    smooth=true;
    label=pick(['червяк','извилина','хвостик','спиралька','вьюнок']);
  } else if(kind==='lumpy'){
    const n=5+(r()*5|0), ph=r()*Math.PI*2;
    pts=[];
    for(let i=0;i<n;i++){
      const a=ph+i/n*Math.PI*2+(r()-.5)*.28;
      pts.push([Math.cos(a)*(.42+r()*.7), Math.sin(a)*(.42+r()*.7)]);
    }
    traits={roundness:.3+r()*.3, spikiness:.22+r()*.3, elongation:.85+r()*.55};
    label=pick(['коряга','бугор','глыба','урод','кракозябра']);
  } else {
    const spikes=5+(r()*8|0), ph=-Math.PI/2+(r()-.5)*.5;
    pts=[];
    for(let i=0;i<spikes;i++){
      const a0=ph+i/spikes*Math.PI*2;
      const a1=ph+(i+.5)/spikes*Math.PI*2;
      pts.push([Math.cos(a0)*(.7+r()*.5), Math.sin(a0)*(.7+r()*.5)]);
      pts.push([Math.cos(a1)*(.16+r()*.26), Math.sin(a1)*(.16+r()*.26)]);
    }
    traits={roundness:.08, spikiness:.8+r()*.2, elongation:.9+r()*.35};
    label=pick(['колючка','ёж','шип','иголка','колючка']);
  }
  pts=normalizePts(pts);
  traits.size=1;
  return {kind, seed, pts, traits, label, smooth};
}

function shape(c,t,x,y,r) {
  c.beginPath();
  switch(t) {
    case 0: c.arc(x,y,r,0,Math.PI*2); break;
    case 1: c.rect(x-r*.78,y-r*.78,r*1.56,r*1.56); break;
    case 2:
      c.moveTo(x,y-r);c.lineTo(x-r*.92,y+r*.76);
      c.lineTo(x+r*.92,y+r*.76);c.closePath();break;
    case 3:
      for(let i=0;i<10;i++){
        let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;
        let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 4:
      c.moveTo(x,y+r*.85);
      c.bezierCurveTo(x-r*1.45,y+r*.05,x-r*1.05,y-r*.95,x-r*.38,y-r*.72);
      c.bezierCurveTo(x-r*.05,y-r*.58,x,y-r*.3,x,y-r*.3);
      c.bezierCurveTo(x,y-r*.3,x+r*.05,y-r*.58,x+r*.38,y-r*.72);
      c.bezierCurveTo(x+r*1.05,y-r*.95,x+r*1.45,y+r*.05,x,y+r*.85);
      break;
    case 5:
      c.moveTo(x,y-r);c.lineTo(x+r*.8,y);c.lineTo(x,y+r);
      c.lineTo(x-r*.8,y);c.closePath();break;
    case 6:
      for(let i=0;i<6;i++){
        let a=i*Math.PI/3-Math.PI/6,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 7:
      c.moveTo(x+r*.12,y-r);c.lineTo(x-r*.62,y+r*.05);
      c.lineTo(x-r*.12,y+r*.05);c.lineTo(x-r*.3,y+r);
      c.lineTo(x+r*.65,y-r*.18);c.lineTo(x+r*.12,y-r*.18);
      c.closePath();break;
    case 8:
      c.moveTo(x-r*.82,y+r*.42);
      c.bezierCurveTo(x-r*1.12,y+r*.05,x-r*.82,y-r*.45,x-r*.38,y-r*.45);
      c.bezierCurveTo(x-r*.18,y-r*1.08,x+r*.68,y-r*.98,x+r*.72,y-r*.3);
      c.bezierCurveTo(x+r*1.2,y-r*.18,x+r*1.12,y+r*.48,x+r*.62,y+r*.48);
      c.lineTo(x-r*.62,y+r*.48);c.closePath();break;
    case 9:
      c.arc(x,y,r,0,Math.PI*2);c.moveTo(x+r*.43,y);
      c.arc(x,y,r*.43,0,Math.PI*2,true);break;
    case 10: {
      let q=r*.36;
      c.moveTo(x-q,y-r);c.lineTo(x+q,y-r);c.lineTo(x+q,y-q);
      c.lineTo(x+r,y-q);c.lineTo(x+r,y+q);c.lineTo(x+q,y+q);
      c.lineTo(x+q,y+r);c.lineTo(x-q,y+r);c.lineTo(x-q,y+q);
      c.lineTo(x-r,y+q);c.lineTo(x-r,y-q);c.lineTo(x-q,y-q);
      c.closePath();break;
    }
    case 11:
      c.arc(x-r*.12,y,r*.82,-Math.PI*.72,Math.PI*.72);
      c.arc(x+r*.42,y-r*.18,r*.78,Math.PI*.72,-Math.PI*.72,true);
      c.closePath();break;
    case 12:
      for(let i=0;i<8;i++){
        let a=i*Math.PI/4;
        c.moveTo(x+Math.cos(a)*r*.3,y+Math.sin(a)*r*.3);
        c.quadraticCurveTo(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25,
          x+Math.cos(a+.3)*r*.3,y+Math.sin(a+.3)*r*.3);
      } c.arc(x,y,r*.3,0,Math.PI*2);break;
    case 13:
      for(let i=0;i<5;i++){
        let a=-Math.PI/2+i*Math.PI*2/5;
        let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 14:
      c.moveTo(x-r,y-r*.45);c.lineTo(x+r*.05,y-r*.45);
      c.lineTo(x+r*.05,y-r);c.lineTo(x+r,y);
      c.lineTo(x+r*.05,y+r);c.lineTo(x+r*.05,y+r*.45);
      c.lineTo(x-r,y+r*.45);c.closePath();break;
    case 15:
      c.ellipse(x,y,r*.78,r,0,0,Math.PI*2);break;
    case 16:
      c.ellipse(x-r*.43,y,r*.48,r*.62,0,0,Math.PI*2);
      c.ellipse(x+r*.43,y,r*.48,r*.62,0,0,Math.PI*2);break;
    case 17:
      c.moveTo(x-r*.88,y-r*.22);
      c.quadraticCurveTo(x,y-r*.72,x+r*.88,y-r*.22);
      c.quadraticCurveTo(x+r*.68,y+r*.65,x,y+r*.48);
      c.quadraticCurveTo(x-r*.68,y+r*.65,x-r*.88,y-r*.22);
      c.closePath();break;
    case 18:
      c.moveTo(x-r*.55,y+r*.82);c.lineTo(x-r*.58,y+r*.12);
      c.lineTo(x-r*.86,y-r*.42);c.lineTo(x-r*.58,y-r*.38);
      c.lineTo(x-r*.42,y-r*.72);c.lineTo(x-r*.2,y-r*.55);
      c.lineTo(x-r*.12,y-r*.82);c.lineTo(x+r*.1,y-r*.55);
      c.lineTo(x+r*.4,y-r*.72);c.lineTo(x+r*.48,y-r*.12);
      c.lineTo(x+r*.72,y-r*.12);c.lineTo(x+r*.55,y+r*.82);
      c.closePath();break;
    case 19:
      c.moveTo(x-r*.78,y-r*.78);c.lineTo(x+r*.12,y-r*.78);
      c.lineTo(x+r*.22,y+r*.18);
      c.quadraticCurveTo(x+r*.9,y+r*.2,x+r*.92,y+r*.68);
      c.quadraticCurveTo(x+r*.9,y+r*.9,x-r*.82,y+r*.9);
      c.quadraticCurveTo(x-r,y+r*.85,x-r*.9,y+r*.55);
      c.closePath();break;
    case 20:
      c.moveTo(x-r*.72,y-r*.35);c.lineTo(x-r*.42,y-r*.35);
      c.bezierCurveTo(x-r*.22,y-r*.35,x-r*.25,y-r*.82,x,y-r*.82);
      c.bezierCurveTo(x+r*.28,y-r*.82,x+r*.25,y-r*.35,x+r*.45,y-r*.35);
      c.lineTo(x+r*.72,y-r*.35);c.lineTo(x+r*.72,y+r*.35);
      c.lineTo(x+r*.45,y+r*.35);
      c.bezierCurveTo(x+r*.25,y+r*.35,x+r*.28,y+r*.82,x,y+r*.82);
      c.bezierCurveTo(x-r*.25,y+r*.82,x-r*.22,y+r*.35,x-r*.42,y+r*.35);
      c.lineTo(x-r*.72,y+r*.35);c.closePath();break;
    case 21:
      c.moveTo(x-r*.06,y);
      c.bezierCurveTo(x-r*.3,y-r*.72,x-r*.95,y-r*.82,x-r*.9,y-r*.28);
      c.bezierCurveTo(x-r*.86,y+r*.12,x-r*.35,y+r*.18,x,y);
      c.bezierCurveTo(x+r*.35,y+r*.18,x+r*.86,y+r*.12,x+r*.9,y-r*.28);
      c.bezierCurveTo(x+r*.95,y-r*.82,x+r*.3,y-r*.72,x+r*.06,y);
      c.closePath();break;
    case 22:
      c.moveTo(x-r*.75,y-r*.62);
      c.quadraticCurveTo(x,y-r*.25,x+r*.75,y-r*.62);
      c.lineTo(x+r*.55,y+r*.45);
      c.quadraticCurveTo(x,y+r*1.05,x-r*.55,y+r*.45);
      c.closePath();break;
  }
}

function krakPath(c,o,r) {
  const P=o.pts.map(p=>[p[0]*r,p[1]*r]);
  c.beginPath();
  if(o.smooth && P.length>2){
    const last=P[P.length-1];
    c.moveTo((P[0][0]+last[0])/2,(P[0][1]+last[1])/2);
    for(let i=0;i<P.length;i++){
      const n=P[(i+1)%P.length];
      c.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+n[0])/2,(P[i][1]+n[1])/2);
    }
    c.closePath();
  } else {
    P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.closePath();
  }
}

function drawToken(c,o,x,y,r,angle=0) {
  c.save();c.translate(x,y);c.rotate(angle);
  if(o.flip)c.scale(-1,1);
  c.shadowColor=o.color;c.shadowBlur=r*.35;
  c.fillStyle=o.color;c.strokeStyle='#fffdf7';c.lineWidth=Math.max(1.5,r*.09);
  if(o.kind && o.pts){
    krakPath(c,o,r);
    c.fill();c.stroke();
  } else {
    shape(c,o.type,0,0,r);
    c.fill(o.type===9?'evenodd':'nonzero');c.stroke();
  }
  c.shadowBlur=0;

  if(o.type===15) {
    c.fillStyle='white';c.beginPath();c.ellipse(0,0,r*.52,r*.7,0,0,Math.PI*2);c.fill();
    c.fillStyle='#26364a';c.beginPath();c.arc(r*.1,r*.05,r*.28,0,Math.PI*2);c.fill();
    c.fillStyle='white';c.beginPath();c.arc(r*.18,-r*.06,r*.09,0,Math.PI*2);c.fill();
  }
  if(o.type===16) {
    [-.43,.43].forEach(dx=>{
      c.fillStyle='white';c.beginPath();c.ellipse(r*dx,0,r*.29,r*.4,0,0,Math.PI*2);c.fill();
      c.fillStyle='#26364a';c.beginPath();c.arc(r*dx+r*.03,r*.04,r*.14,0,Math.PI*2);c.fill();
    });
  }
  if(o.type===17) {
    c.fillStyle='white';c.fillRect(-r*.43,-r*.17,r*.86,r*.28);
  }
  c.restore();
}

function speedRange() {
  const short=Math.min(w,h);
  const t=Math.min(1, elapsed/ROUND);
  // Start clearly faster than the old 0.20–0.34*short, ramp to a brisk finish.
  return [(0.32+0.18*t)*short, (0.46+0.24*t)*short];
}

function spawn() {
  const b=playBounds();
  const short=Math.min(w,h);
  const [lo,hi]=speedRange();
  const speed=rand(lo,hi);
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=b.left+8;y=rand(b.top+24,b.bottom-24)}
  if(side===1){x=b.right-8;y=rand(b.top+24,b.bottom-24)}
  if(side===2){x=rand(b.left+24,b.right-24);y=b.top+8}
  if(side===3){x=rand(b.left+24,b.right-24);y=b.bottom-8}
  const tx=rand(b.left+(b.right-b.left)*.28, b.right-(b.right-b.left)*.28);
  const ty=rand(b.top+(b.bottom-b.top)*.28, b.bottom-(b.bottom-b.top)*.28);
  const dx=tx-x,dy=ty-y,len=Math.hypot(dx,dy)||1;
  const rad=short<=520?rand(26,36):rand(22,30);
  const isKrak=Math.random()<0.48;
  let part;
  if(isKrak){
    part=makeKrako();
    part.type=-1;
    part.traits.size=rad/30;
  } else {
    const type=Math.floor(Math.random()*GEO.length);
    const g=GEO[type];
    part={
      type, kind:null, pts:null, label:g.name,
      traits:{
        roundness:g.roundness, spikiness:g.spikiness,
        elongation:g.elongation, size:rad/30
      }
    };
  }
  targets.push({
    ...part,
    x,y,vx:dx/len*speed,vy:dy/len*speed,r:rad,
    color:pick(colors),rot:rand(0,6.28),spin:rand(-1.4,1.4),life:rand(9,14)
  });
}

function burst(x,y,color) {
  for(let i=0;i<9;i++)
    sparks.push({x,y,vx:rand(-130,130),vy:rand(-150,80),
      life:.55,max:.55,color});
}

function background() {
  ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#142b3b');g.addColorStop(.5,'#202b46');g.addColorStop(1,'#392846');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let i=0;i<48;i++) {
    const x=(i*137.5%997)/997*w;
    const y=(i*83.7%991)/991*h;
    ctx.globalAlpha=.15+(i%4)*.06;
    ctx.fillStyle='#fff4d9';ctx.beginPath();
    ctx.arc(x,y,i%7===0?1.5:.8,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function update(dt) {
  elapsed+=dt;spawnClock+=dt;
  const interval=targets.length<6?.26:targets.length<8?.42:.7;
  while(spawnClock>interval&&targets.length<9){spawnClock-=interval;spawn()}
  if(targets.length>=9)spawnClock=Math.min(spawnClock,interval);
  const b=playBounds();
  const [lo,hi]=speedRange();
  const aim=(lo+hi)*0.55;
  for(let i=targets.length-1;i>=0;i--) {
    let o=targets[i];
    const sp=Math.hypot(o.vx,o.vy)||1;
    if(sp<aim){
      const k=Math.min(aim/sp, 1+dt*0.55);
      o.vx*=k;o.vy*=k;
    }
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.spin*dt;o.life-=dt;
    if(o.y<b.top+o.r&&o.vy<0){o.y=b.top+o.r;o.vy=Math.abs(o.vy)}
    if(o.y>b.bottom-o.r&&o.vy>0){o.y=b.bottom-o.r;o.vy=-Math.abs(o.vy)}
    if(o.life<=0||o.x<-80||o.x>w+80)
      targets.splice(i,1);
  }
  for(let i=sparks.length-1;i>=0;i--) {
    let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)sparks.splice(i,1);
  }
  if(elapsed>=ROUND||caught.length>=GOAL)finish();
}

function render() {
  background();
  targets.forEach(o=>drawToken(ctx,o,o.x,o.y,o.r,o.rot));
  sparks.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function frame(t) {
  if(!running)return;
  const dt=Math.min((t-last)/1000,.04);
  last=t;update(dt);render();
  $('timer').textContent=Math.max(0,Math.ceil(ROUND-elapsed));
  if(running)raf=requestAnimationFrame(frame);
}

function catchAt(x,y) {
  if(!running)return;
  for(let i=targets.length-1;i>=0;i--) {
    const o=targets[i];
    if((x-o.x)**2+(y-o.y)**2<(o.r*1.35+24)**2) {
      targets.splice(i,1);
      caught.push({
        type:o.type, kind:o.kind, pts:o.pts, smooth:o.smooth,
        seed:o.seed, label:o.label, traits:{...o.traits},
        color:o.color, rot:o.rot
      });
      burst(o.x,o.y,o.color);
      $('score').textContent=caught.length;
      $('meter').style.width=(caught.length/GOAL*100)+'%';
      $('hint').textContent='Поймано: '+(o.label||'деталь')+'!';
      if(caught.length>=GOAL)finish();
      return;
    }
  }
}

field.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const rect=field.getBoundingClientRect();
  catchAt(e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});

function avgTraits(parts) {
  if(!parts.length)return {roundness:.5,spikiness:.3,elongation:1};
  const s={roundness:0,spikiness:0,elongation:0};
  parts.forEach(p=>{
    const t=p.traits||{};
    s.roundness+=t.roundness||.4;
    s.spikiness+=t.spikiness||.2;
    s.elongation+=t.elongation||1;
  });
  const n=parts.length;
  return {roundness:s.roundness/n, spikiness:s.spikiness/n, elongation:s.elongation/n};
}

function requestedScheme() {
  try {
    const q=(new URLSearchParams(location.search).get('scheme')||'').toLowerCase();
    if(['trex','t-rex','tRex','dino','tyrant','тираннозавр'].includes(q))return 'trex';
    if(['orb','cyclops','eye','shar','ball','одноглаз','один'].includes(q))return 'orb';
    if(['kraken','krak','octopus','кракен'].includes(q))return 'kraken';
  } catch(e){}
  return null;
}

function pickScheme(parts) {
  const forced=requestedScheme();
  if(forced)return forced;
  const a=avgTraits(parts);
  const w={
    trex: 1 + a.spikiness*0.9 + (a.elongation>1.25?0.25:0),
    orb:  1 + a.roundness*1.0 - a.spikiness*0.15,
    kraken:1 + Math.max(0,a.elongation-1)*0.8 + a.spikiness*0.2
  };
  const total=w.trex+w.orb+w.kraken;
  let x=Math.random()*total;
  if((x-=w.trex)<=0)return 'trex';
  if((x-=w.orb)<=0)return 'orb';
  return 'kraken';
}

function scorePart(p, want) {
  if(!want)return 0;
  const t=p.traits||{};
  let s=0;
  if(want.roundness!=null) s-=Math.abs((t.roundness||0)-want.roundness);
  if(want.spikiness!=null) s-=Math.abs((t.spikiness||0)-want.spikiness)*1.15;
  if(want.elongation!=null) s-=Math.abs((t.elongation||1)-want.elongation)*0.55;
  if(want.minSpike && (t.spikiness||0)>=want.minSpike) s+=.5;
  if(want.minElong && (t.elongation||1)>=want.minElong) s+=.5;
  if(want.minRound && (t.roundness||0)>=want.minRound) s+=.5;
  if(want.maxRound!=null && (t.roundness||0)<=want.maxRound) s+=.2;
  return s;
}

function takeBest(pool, want) {
  if(!pool.length)return null;
  let bi=0, bs=-1e9;
  pool.forEach((p,i)=>{
    const s=scorePart(p,want);
    if(s>bs){bs=s;bi=i;}
  });
  return pool.splice(bi,1)[0];
}

function makeName(parts, scheme) {
  const a=avgTraits(parts);
  const hasZig=parts.some(p=>p.kind==='zigzag'||p.kind==='worm'||p.label==='зигзаг'||p.label==='молния'||p.type===7);
  const hasSpike=parts.some(p=>p.kind==='spiky'||p.type===3||(p.traits&&p.traits.spikiness>.75));
  let adj;
  if(a.spikiness>=.55 || hasSpike) adj=pick(['Колючий','Игольчатый','Зубастый']);
  else if(hasZig || a.elongation>=1.55) adj=pick(['Кривой','Зигзаговый','Червячный']);
  else if(a.roundness>=.7) adj=pick(['Пухлый','Круглый','Шаровидный']);
  else if(parts.some(p=>p.kind==='lumpy'||p.kind==='blob')) adj=pick(['Бугристый','Корявый','Странный']);
  else adj=pick(['Странный','Абсурдный','Кривой']);

  if(scheme==='kraken'){
    if(adj==='Зигзаговый' || (hasZig && a.elongation>1.4)) return 'Зигзагокракен';
    return adj+' кракен';
  }
  if(scheme==='orb'){
    if(adj==='Кривой') return 'Кривой одноглаз';
    return adj+' одноглаз';
  }
  return adj+' тираннозавр';
}


function parseHex(hex){
  hex=String(hex||'#ff715f').replace('#','');
  if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
  return [parseInt(hex.slice(0,2),16)||0,parseInt(hex.slice(2,4),16)||0,parseInt(hex.slice(4,6),16)||0];
}
function toHex(r,g,b){
  return '#'+[r,g,b].map(v=>('0'+Math.max(0,Math.min(255,v|0)).toString(16)).slice(-2)).join('');
}
function darken(hex,amt){
  const [r,g,b]=parseHex(hex);
  return toHex(r*(1-amt),g*(1-amt),b*(1-amt));
}
function lighten(hex,amt){
  const [r,g,b]=parseHex(hex);
  return toHex(r+(255-r)*amt,g+(255-g)*amt,b+(255-b)*amt);
}
function dominantColor(parts){
  if(!parts||!parts.length)return '#ff715f';
  const c={};
  parts.forEach(p=>{ if(p.color)c[p.color]=(c[p.color]||0)+1; });
  const keys=Object.keys(c);
  if(!keys.length)return '#ff715f';
  keys.sort((a,b)=>c[b]-c[a]);
  return keys[0];
}

function capsulePath(c,x1,y1,x2,y2,r1,r2){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len,a=Math.atan2(dy,dx);
  c.moveTo(x1+nx*r1,y1+ny*r1);
  c.lineTo(x2+nx*r2,y2+ny*r2);
  c.arc(x2,y2,Math.max(.1,r2),a-Math.PI/2,a+Math.PI/2);
  c.lineTo(x1-nx*r1,y1-ny*r1);
  c.arc(x1,y1,Math.max(.1,r1),a+Math.PI/2,a-Math.PI/2);
  c.closePath();
}
function ribbonPath(c,spine){
  if(!spine.length)return;
  const L=[],R=[];
  for(let i=0;i<spine.length;i++){
    const p=spine[i], q=spine[Math.min(i+1,spine.length-1)], prev=spine[Math.max(i-1,0)];
    let dx=q.x-prev.x,dy=q.y-prev.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len,w=p.w;
    L.push({x:p.x+nx*w,y:p.y+ny*w});
    R.push({x:p.x-nx*w,y:p.y-ny*w});
  }
  c.moveTo(L[0].x,L[0].y);
  for(let i=1;i<L.length;i++)c.lineTo(L[i].x,L[i].y);
  for(let i=R.length-1;i>=0;i--)c.lineTo(R[i].x,R[i].y);
  c.closePath();
}
function sampleCurve(pts, steps){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const n=i===pts.length-2?steps:steps-1;
    for(let k=0;k<n;k++){
      const t=k/steps;
      out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,w:a.w+(b.w-a.w)*t});
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function spineAt(spine, t){
  if(!spine.length)return {x:0,y:0,w:1,rot:0};
  if(spine.length===1)return {...spine[0],rot:0};
  let total=0;
  const seg=[];
  for(let i=0;i<spine.length-1;i++){
    const d=Math.hypot(spine[i+1].x-spine[i].x,spine[i+1].y-spine[i].y);
    seg.push(d);total+=d;
  }
  let d=Math.max(0,Math.min(1,t))*total, i=0;
  while(i<seg.length-1 && d>seg[i]){d-=seg[i];i++;}
  const a=spine[i],b=spine[Math.min(i+1,spine.length-1)];
  const u=seg[i]?d/seg[i]:0;
  return {
    x:a.x+(b.x-a.x)*u,
    y:a.y+(b.y-a.y)*u,
    w:a.w+(b.w-a.w)*u,
    rot:Math.atan2(b.y-a.y,b.x-a.x)
  };
}
function paint(c,fill,stroke,lw){
  c.fillStyle=fill;
  c.strokeStyle=stroke;
  c.lineWidth=lw;
  c.lineJoin='round';
  c.lineCap='round';
  c.fill();
  c.stroke();
}

function classifyPart(p){
  const t=p.traits||{};
  const k=p.kind, typ=p.type;
  if(k==='worm' || typ===14 || (t.elongation>=1.55 && (t.spikiness||0)<.55)) return 'long';
  if(k==='spiky'||k==='zigzag'||typ===2||typ===3||typ===7||typ===10|| (t.spikiness||0)>=.5) return 'spiky';
  if(k==='blob'||typ===0||typ===4||typ===8||typ===9||typ===11|| (t.roundness||0)>=.6) return 'round';
  if(k==='lumpy'||typ===1||typ===5||typ===6||typ===13) return 'lumpy';
  return 'decor';
}

function traitsMorph(parts){
  const list=parts||[];
  const a=avgTraits(list);
  const counts={spiky:0,long:0,round:0,lumpy:0,decor:0};
  list.forEach(p=>counts[classifyPart(p)]++);
  const n=Math.max(1,list.length);
  const roundShare=counts.round/n;
  const spikeShare=counts.spiky/n;
  const longShare=counts.long/n;
  const fat=0.76 + 0.50*Math.min(1,a.roundness) + 0.22*roundShare; // ~0.76–1.48
  const spike=Math.min(1, a.spikiness*0.8 + spikeShare*0.55);
  const elong=Math.max(0.72, Math.min(2.15, a.elongation*(0.88+0.4*longShare)));
  const limb=0.82 + 0.45*(fat-0.76);
  const size=list.reduce((s,p)=>s+((p.traits&&p.traits.size)||1),0)/n;
  return {fat,spike,elong,limb,size,counts,n,roundness:a.roundness,spikiness:a.spikiness,elongation:a.elongation};
}

function palFrom(color){
  return {
    main:color,
    dark:darken(color,.22),
    light:lighten(color,.28),
    ink:'#2a3344',
    teeth:'#fff6e8',
    mouth:darken(color,.55),
    tissue:lighten(color,.08)
  };
}

function boneWorld(bones,id,t,reduced){
  const chain=[];
  let cur=id;
  while(cur && bones[cur]){
    chain.push(cur);
    cur=bones[cur].parent;
  }
  chain.reverse();
  let x=0,y=0,rot=0;
  chain.forEach(k=>{
    const b=bones[k];
    const wig=(!reduced && b.amp)?Math.sin((t||0)/680+b.phase)*b.amp:0;
    const lx=b.x||0, ly=b.y||0, lr=(b.rot||0)+wig;
    const c=Math.cos(rot),s=Math.sin(rot);
    x+=lx*c-ly*s;
    y+=lx*s+ly*c;
    rot+=lr;
  });
  return {x,y,rot};
}
function withBone(c,bones,id,t,reduced,fn){
  const w=boneWorld(bones,id,t,reduced);
  c.save();
  c.translate(w.x,w.y);
  c.rotate(w.rot);
  fn(c);
  c.restore();
}

function trexTailSpine(m){
  // Wide at the hips so the tail flows out of the body, then tapers to a point.
  const s=0.72+0.46*(m.elong-0.72);
  const w=0.9*m.limb;
  return [
    {x:28,y:-8,w:40*w},{x:-8*s,y:10,w:32*w},{x:-70*s,y:26,w:24*w},
    {x:-130*s,y:22,w:16*w},{x:-182*s,y:4,w:10*w},{x:-226*s,y:-24*s,w:5*w},{x:-262*s,y:-50*s,w:1.4}
  ];
}

function trexLegGeom(kind, m){
  // Classic side-view T-rex: thick thigh down-forward, shin angled back, foot + toes forward.
  const thk=m.limb*(0.95+0.45*(m.fat-0.76)), near=kind==='near', k=near?1:0.92;
  const thigh={
    x0:near?6:-2, y0:6,
    x1:near?28:18, y1:78*k,
    r0:34*thk*(near?1.08:0.95), r1:26*thk*(near?1:0.92)
  };
  const shin={
    x0:thigh.x1, y0:thigh.y1,
    x1:near?-8:-16, y1:136*k,
    r0:22*thk*(near?1:0.92), r1:13*thk
  };
  const foot={
    x:shin.x1+28, y:shin.y1+8,
    rx:34*(near?1:0.9), ry:13,
    toes:near
      ?[[18,-3,12],[28,3,11],[10,9,10]]
      :[[16,-3,11],[26,3,10],[8,9,9]]
  };
  return {thigh,shin,foot};
}

function trexSeg(s){
  return {
    x:(s.x0+s.x1)/2,
    y:(s.y0+s.y1)/2,
    rot:Math.atan2(s.y1-s.y0,s.x1-s.x0),
    len:Math.hypot(s.x1-s.x0,s.y1-s.y0)
  };
}

function trexDesign(m){
  const F=m.fat, E=m.elong;
  const neck=48*(0.85+0.3*(E-0.72));
  // Hip is the origin: torso, tail and legs all meet here.
  const bones={
    root:{x:0,y:0,rot:-0.04,amp:0,phase:0},
    torso:{parent:'root',x:22,y:-30-(F-1)*6,rot:-0.34,amp:0.025,phase:0.2,pivot:true},
    head:{parent:'torso',x:50+neck*0.22,y:-20-(F-1)*3,rot:-0.04,amp:0.035,phase:1.1,pivot:true},
    jaw:{parent:'head',x:24,y:30,rot:0.08,amp:0.04,phase:2.2,pivot:true},
    tail:{parent:'root',x:-4,y:-2,rot:0.08,amp:0.04,phase:0.6,pivot:true},
    arm:{parent:'torso',x:44,y:18,rot:0,amp:0.06,phase:1.7,pivot:true},
    // Hips sit under the pear and overlap its bottom.
    legFar:{parent:'root',x:-10,y:10,rot:0,amp:0.03,phase:2.8,pivot:true},
    legNear:{parent:'root',x:12,y:12,rot:0,amp:0.03,phase:3.5,pivot:true}
  };
  const tail=trexTailSpine(m);
  const tip=tail[tail.length-1];
  const legNear=trexLegGeom('near',m);
  const legFar=trexLegGeom('far',m);
  const shadow={x:10,y:168+(F-1)*12,rx:120+F*28,ry:18+F*4};
  const bbox={
    minX:Math.min(-100, tip.x-36)-16,
    minY:-210-(F-1)*20,
    maxX:240+(F-1)*20,
    maxY:180+(F-1)*16
  };
  return {bones,shadow,bbox,tilt:-0.03,tail,legNear,legFar,morph:m};
}

function orbDesign(m){
  const F=m.fat;
  const R=108*F;
  const bones={
    root:{x:0,y:0,rot:0,amp:0,phase:0},
    body:{parent:'root',x:0,y:0,rot:0,amp:0.02,phase:0.4,pivot:true},
    hornL:{parent:'body',x:-R*0.42,y:-R*0.92,rot:0,amp:0.05,phase:1.2,pivot:true},
    hornR:{parent:'body',x:R*0.44,y:-R*0.90,rot:0,amp:0.05,phase:1.8,pivot:true},
    armL:{parent:'body',x:-R*1.02,y:R*0.08,rot:0,amp:0.06,phase:2.1,pivot:true},
    armR:{parent:'body',x:R*1.02,y:R*0.08,rot:0,amp:0.06,phase:2.7,pivot:true},
    legL:{parent:'body',x:-R*0.36,y:R*0.92,rot:0,amp:0.03,phase:0.8,pivot:true},
    legR:{parent:'body',x:R*0.38,y:R*0.92,rot:0,amp:0.03,phase:1.5,pivot:true}
  };
  const hornReach=70+m.spike*50;
  const armReach=70+ (m.elong-0.72)*28;
  const shadow={x:0,y:R+58,rx:R*0.85,ry:16+F*6};
  const bbox={minX:-R-armReach-20,minY:-R-hornReach-10,maxX:R+armReach+20,maxY:R+70};
  return {bones,shadow,bbox,tilt:0.05,bodyR:R,morph:m};
}

function octoSpine(i, spread, m){
  // Unique soft S-curves / curls per arm. Some rise, some hang. Asymmetric. No knees.
  const E=m.elong, F=m.fat;
  const L=0.86+0.28*Math.min(1.2, E-0.72);
  const thick0=34+F*12;
  const specs=[
    {p1:[-52,-28], p2:[-128,-108], p3:[-96,-18]},   // 0 left wave, up then hook
    {p1:[-78, 28], p2:[-156,  62], p3:[-124,148]},  // 1 left side S, out then down
    {p1:[-36, 86], p2:[ -8, 176], p3:[-78, 248]},   // 2 left drape
    {p1:[-12, 96], p2:[ 36, 178], p3:[-48, 268]},   // 3 left hang, long S
    {p1:[ 28, 82], p2:[-18, 168], p3:[ 62, 246]},   // 4 right hang, different S
    {p1:[ 58, 74], p2:[ 108,148], p3:[ 36, 228]},   // 5 right drape
    {p1:[ 96,  8], p2:[ 172,  58], p3:[ 128,142]},  // 6 right side, not a mirror
    {p1:[ 58,-44], p2:[ 148,-86], p3:[ 168,  8]}    // 7 right wave, wider hook
  ];
  const sp=specs[i%8];
  const p1x=sp.p1[0]*L, p1y=sp.p1[1]*L;
  const p2x=sp.p2[0]*L, p2y=sp.p2[1]*L;
  const p3x=sp.p3[0]*L, p3y=sp.p3[1]*L;
  const n=20, spine=[];
  for(let k=0;k<=n;k++){
    const t=k/n,u=1-t;
    let x=3*u*u*t*p1x + 3*u*t*t*p2x + t*t*t*p3x;
    let y=3*u*u*t*p1y + 3*u*t*t*p2y + t*t*t*p3y;
    const dx=p3x, dy=p3y, len=Math.hypot(dx,dy)||1;
    const wave=Math.sin(t*Math.PI*1.15+i*0.55)*10*t*(1-t)*2;
    x+=(-dy/len)*wave; y+=(dx/len)*wave*0.35;
    spine.push({x,y,w:thick0*(1-t*0.82)});
  }
  return spine;
}

function krakenDesign(m){
  const F=m.fat;
  const R=100*F;
  const bones={
    root:{x:0,y:0,rot:0,amp:0,phase:0},
    mantle:{parent:'root',x:0,y:-36,rot:0,amp:0.02,phase:0.5,pivot:true}
  };
  // Irregular attaches around the sides and underside — not a regular radial fan.
  const attaches=[
    {a:-2.1,x:-R*0.88,y:-R*0.08},
    {a:-1.5,x:-R*1.05,y: R*0.22},
    {a:-0.9,x:-R*0.72,y: R*0.72},
    {a:-0.25,x:-R*0.22,y: R*0.98},
    {a: 0.38,x: R*0.32,y: R*0.92},
    {a: 0.95,x: R*0.86,y: R*0.62},
    {a: 1.55,x: R*1.08,y: R*0.12},
    {a: 2.05,x: R*0.70,y:-R*0.16}
  ];
  const tent=[];
  attaches.forEach((at,i)=>{
    const id='tent'+i;
    bones[id]={parent:'mantle',x:at.x,y:at.y,rot:0,amp:0.04,phase:0.5+i*0.73,pivot:true};
    tent.push({id,a:at.a,i,spine:octoSpine(i,at.a,m)});
  });
  let minX=-R,maxX=R,minY=-R*1.2,maxY=R;
  tent.forEach(te=>{
    const bx=bones[te.id].x, by=bones[te.id].y;
    te.spine.forEach(p=>{
      minX=Math.min(minX,bx+p.x-28);
      maxX=Math.max(maxX,bx+p.x+28);
      minY=Math.min(minY,by+p.y-28);
      maxY=Math.max(maxY,by+p.y+28);
    });
  });
  const shadow={x:8,y:maxY+2,rx:Math.max(160,(maxX-minX)*0.28),ry:20};
  const bbox={minX:minX-8,minY:minY-12,maxX:maxX+8,maxY:maxY+10};
  return {bones,shadow,bbox,tilt:0.03,tent,headR:R,morph:m};
}

function drawBodyPart(c,o,r){
  c.save();
  c.shadowBlur=0;
  c.fillStyle=o.color||'#ff715f';
  c.strokeStyle='#2a3344';
  c.lineWidth=Math.max(2.6,r*0.075);
  c.lineJoin='round';
  c.lineCap='round';
  if(o.kind && o.pts){
    krakPath(c,o,r);
    c.fill();c.stroke();
  } else {
    shape(c,o.type,0,0,r);
    c.fill(o.type===9?'evenodd':'nonzero');c.stroke();
  }
  c.restore();
}

function drawTrexTissue(c, pal, bones, t, reduced, design){
  const m=design.morph, ink=pal.ink, lw=5.5;
  const F=m.fat, fill=pal.tissue;
  c.save();
  c.globalAlpha=0.7;
  // TAIL — wide at the hip so it reads as a continuous taper out of the body
  withBone(c,bones,'tail',t,reduced,c=>{
    c.beginPath();
    ribbonPath(c,sampleCurve(design.tail,6));
    paint(c,pal.dark,ink,lw);
  });
  // FAR LEG (behind the body)
  withBone(c,bones,'legFar',t,reduced,c=>{
    drawTrexLeg(c, pal, design.legFar, ink, lw, true);
  });
  // HIP fill only (no extra outline) — glues tail and thighs into the pear
  withBone(c,bones,'root',t,reduced,c=>{
    c.beginPath();
    c.ellipse(8,6,38+F*8,28+F*4,0.12,0,Math.PI*2);
    c.fillStyle=fill;c.fill();
  });
  // PEAR TORSO: wide hips at the rear, chest tapering into a short thick neck
  withBone(c,bones,'torso',t,reduced,c=>{
    const rw=62*Math.min(1.25,F), nw=28*Math.min(1.2,F), len=70*Math.min(1.22,F);
    c.beginPath();
    // start at rear-upper (back)
    c.moveTo(-len*0.62, -rw*0.15);
    c.bezierCurveTo(-len*0.8, -rw*0.55, -len*0.25, -rw*0.95, 10, -rw*0.62);
    c.bezierCurveTo(len*0.42, -rw*0.4, len*0.62, -nw*0.7, len*0.82, -nw*0.15);
    c.bezierCurveTo(len*0.95, nw*0.35, len*0.55, nw*0.85, 12, rw*0.72);
    c.bezierCurveTo(-len*0.15, rw*1.12, -len*0.72, rw*0.8, -len*0.62, -rw*0.15);
    c.closePath();
    paint(c,fill,ink,lw);
    // short thick neck into the head
    const hx=bones.head.x, hy=bones.head.y;
    c.beginPath();
    capsulePath(c, len*0.62, -4, hx*0.88, hy+10, 22*Math.min(1.15,F), 18);
    paint(c,fill,ink,lw);
  });
  // NEAR LEG — overlaps the bottom of the torso
  withBone(c,bones,'legNear',t,reduced,c=>{
    drawTrexLeg(c, pal, design.legNear, ink, lw, false);
  });
  // tiny arms
  withBone(c,bones,'arm',t,reduced,c=>{
    c.beginPath();capsulePath(c,0,0,28,16,7,5);paint(c,fill,ink,lw);
    c.beginPath();capsulePath(c,28,16,22,28,5,3.5);paint(c,fill,ink,lw);
    c.beginPath();capsulePath(c,28,16,36,26,5,3.5);paint(c,fill,ink,lw);
  });
  withBone(c,bones,'head',t,reduced,c=>{
    c.beginPath();
    c.moveTo(-36,-18);
    c.bezierCurveTo(-40,-70,10,-88,48,-60);
    c.bezierCurveTo(78,-48,96,-28,108,-8);
    c.bezierCurveTo(118,6,112,18,98,22);
    c.lineTo(36,16);
    c.bezierCurveTo(8,28,-28,20,-36,-18);
    c.closePath();
    paint(c,fill,ink,lw);
  });
  c.restore();
}

function drawTrexLeg(c, pal, geom, ink, lw, dark){
  const fill=dark?pal.dark:pal.tissue;
  const th=geom.thigh, sh=geom.shin, ft=geom.foot;
  c.beginPath();
  capsulePath(c,th.x0,th.y0,th.x1,th.y1,th.r0,th.r1);
  paint(c,fill,ink,lw);
  c.beginPath();
  capsulePath(c,sh.x0,sh.y0,sh.x1,sh.y1,sh.r0,sh.r1);
  paint(c,fill,ink,lw);
  c.beginPath();
  c.ellipse(ft.x,ft.y,ft.rx,ft.ry,0.08,0,Math.PI*2);
  paint(c,fill,ink,lw);
  (ft.toes||[]).forEach(p=>{
    c.beginPath();
    c.ellipse(ft.x+p[0],ft.y+p[1],p[2],6,0.18,0,Math.PI*2);
    paint(c,fill,ink,lw*0.8);
  });
}

function drawTrexJaw(c, pal, bones, t, reduced, design){
  // Mandatory jaw + teeth, always on top of tissue / under or over parts as called
  const ink=pal.ink, lw=5.5, m=design.morph, F=m.fat;
  withBone(c,bones,'jaw',t,reduced,c=>{
    c.beginPath();
    c.moveTo(-8,-8);
    c.lineTo(86,-2);
    c.bezierCurveTo(96,8,90,26,70,30);
    c.bezierCurveTo(30,36,-4,24,-10,8);
    c.closePath();
    paint(c,pal.tissue,ink,lw);
  });
  withBone(c,bones,'head',t,reduced,c=>{
    // mouth cavity
    c.beginPath();
    c.moveTo(28,8);
    c.lineTo(100,6);
    c.lineTo(92,28);
    c.bezierCurveTo(60,38,32,28,28,8);
    c.closePath();
    c.fillStyle=pal.mouth;c.fill();
    c.strokeStyle=ink;c.lineWidth=3;c.stroke();
    // upper teeth
    const teeth=pal.teeth;
    for(let i=0;i<6;i++){
      const x=40+i*11, top=9, h=10+(i%3===1?4:0);
      c.beginPath();
      c.moveTo(x,top);c.lineTo(x+5,top+h);c.lineTo(x+10,top);
      c.closePath();
      c.fillStyle=teeth;c.strokeStyle=ink;c.lineWidth=1.6;c.fill();c.stroke();
    }
    // lower teeth
    withBone(c,bones,'jaw',t,reduced,()=>{});
  });
  withBone(c,bones,'jaw',t,reduced,c=>{
    for(let i=0;i<5;i++){
      const x=18+i*13, y=4, h=8+(i%2?3:0);
      c.beginPath();
      c.moveTo(x,y);c.lineTo(x+5,y-h);c.lineTo(x+10,y);
      c.closePath();
      c.fillStyle=pal.teeth;c.strokeStyle=ink;c.lineWidth=1.6;c.fill();c.stroke();
    }
  });
}

function drawOrbTissue(c, pal, bones, t, reduced, design){
  const m=design.morph, R=design.bodyR, ink=pal.ink, lw=5.5;
  const fill=pal.tissue;
  c.save();
  c.globalAlpha=0.42;
  withBone(c,bones,'body',t,reduced,c=>{
    c.beginPath();c.arc(0,0,R*0.68,0,Math.PI*2);paint(c,fill,ink,lw);
    // light belly hint
    c.beginPath();c.ellipse(0,R*0.22,R*0.45,R*0.32,0,0,Math.PI*2);
    c.fillStyle=pal.light;c.globalAlpha=0.28;c.fill();
  });
  c.globalAlpha=0.7;
  // thin horn guides
  [['hornL',-0.35],['hornR',0.35]].forEach(([id,rot])=>{
    withBone(c,bones,id,t,reduced,c=>{
      c.save();c.rotate(rot);
      c.beginPath();
      c.moveTo(-10,8);c.lineTo(0,-36-m.spike*18);c.lineTo(10,8);c.closePath();
      paint(c,fill,ink,lw);
      c.restore();
    });
  });
  [['armL',-0.55],['armR',0.55]].forEach(([id,rot])=>{
    withBone(c,bones,id,t,reduced,c=>{
      c.save();c.rotate(rot);
      const len=48+(m.elong-0.72)*18;
      c.beginPath();capsulePath(c,0,0,len,0,6,4);paint(c,fill,ink,lw);
      c.beginPath();c.arc(len,0,7,0,Math.PI*2);paint(c,fill,ink,lw);
      c.restore();
    });
  });
  [['legL',0.15],['legR',-0.15]].forEach(([id,rot])=>{
    withBone(c,bones,id,t,reduced,c=>{
      c.save();c.rotate(rot);
      c.beginPath();capsulePath(c,0,0,6,36*m.limb,11,9);paint(c,fill,ink,lw);
      c.beginPath();c.ellipse(8,42*m.limb,16,8,0.1,0,Math.PI*2);paint(c,fill,ink,lw);
      c.restore();
    });
  });
  c.restore();
}

function drawKrakenTissue(c, pal, bones, t, reduced, design){
  const ink=pal.ink, lw=5.5, m=design.morph, R=design.headR;
  const fill=pal.tissue;
  // Soft tapered ribbons — a core only; parts carry the arm mass when present.
  design.tent.forEach(te=>{
    withBone(c,bones,te.id,t,reduced,c=>{
      c.globalAlpha=0.5;
      c.beginPath();
      ribbonPath(c,sampleCurve(te.spine,6));
      paint(c, te.i%2?pal.dark:fill, ink, lw);
      c.globalAlpha=1;
    });
  });
  // Bulbous mantle, slightly smaller than the head part so the caught shape is the head
  withBone(c,bones,'mantle',t,reduced,c=>{
    c.globalAlpha=0.42;
    c.beginPath();
    c.moveTo(-R*0.78,R*0.28);
    c.bezierCurveTo(-R*1.02,R*0.02,-R*0.95,-R*0.42,-R*0.55,-R*0.78);
    c.bezierCurveTo(-R*0.18,-R*1.08,R*0.18,-R*1.08,R*0.55,-R*0.78);
    c.bezierCurveTo(R*0.95,-R*0.42,R*1.02,R*0.02,R*0.78,R*0.28);
    c.bezierCurveTo(R*0.42,R*0.62,-R*0.42,R*0.62,-R*0.78,R*0.28);
    c.closePath();
    paint(c,fill,ink,lw);
    c.beginPath();
    c.ellipse(0,-R*0.12,R*0.42,R*0.32,0,0,Math.PI*2);
    c.fillStyle=pal.light;c.globalAlpha=0.28;c.fill();
    c.globalAlpha=1;
  });
}

function slot(id,cls,bone,x,y,rot,sx,sy,r,z,pri){
  return {id,cls,bone,x,y,rot,sx,sy,r,z,pri};
}

function trexSlots(design){
  const m=design.morph, F=m.fat, E=m.elong;
  const slots=[];
  // Torso: biggest caught shape, aligned to the body axis (slot.rot=0 — bone already leans).
  // Deformed into a forward-leaning pear, like the orb's body slot.
  slots.push(slot('torso','round','torso',4,8,0,1.32,1.08,68*Math.min(1.22,F),20,1));
  slots.push(slot('head','round','head',4,-22,0,1.22,1.08,58*F,40,2));
  // Legs: one part per thigh and shin, rotation = bone direction only.
  [['N','legNear',design.legNear,28],['F','legFar',design.legFar,8]].forEach(([tag,bone,geom,z])=>{
    const th=trexSeg(geom.thigh), sh=trexSeg(geom.shin);
    const k=tag==='N'?1:0.92;
    slots.push(slot('thigh'+tag,'lumpy',bone,th.x,th.y,th.rot, 1.85, 0.72, 38*m.limb*k, z, 3+(tag==='F'?1:0)));
    slots.push(slot('shin'+tag,'lumpy',bone,sh.x,sh.y,sh.rot, 1.7, 0.58, 30*m.limb*k, z, 5+(tag==='F'?1:0)));
  });
  const tailN=Math.max(2, Math.min(4, 2+Math.round((E-0.85)*1.6)+(m.counts.long>=3?1:0)));
  const spine=sampleCurve(design.tail,6);
  for(let i=0;i<tailN;i++){
    const tt=(i+0.45)/(tailN+0.2);
    const p=spineAt(spine,tt);
    slots.push(slot('tail'+i,'long','tail',p.x,p.y,p.rot,2.2-tt*0.35,0.7, 42-i*4, 10, 7+i));
  }
  slots.push(slot('arm','long','arm',16,8,0.5,1.35,0.42,14,35,20));
  return slots;
}

function orbSlots(design){
  const m=design.morph, R=design.bodyR, F=m.fat;
  const slots=[];
  slots.push(slot('body','round','body',0,4,0,1.0,1.0,R*0.98,20,1));
  slots.push(slot('belly','round','body',0,R*0.28,0,1.1,0.85,R*0.40,22,5));
  slots.push(slot('hornL','spiky','hornL',0,-22,-0.35,0.75,1.5,32+m.spike*16,40,2));
  slots.push(slot('hornR','spiky','hornR',0,-22, 0.35,0.75,1.5,32+m.spike*16,40,3));
  slots.push(slot('legL','lumpy','legL',4,20,0.1,0.95,1.2,30*m.limb,15,4));
  slots.push(slot('legR','lumpy','legR',-4,20,-0.1,0.95,1.2,30*m.limb,15,5));
  slots.push(slot('armL','long','armL',-8,8,-0.55,1.85,0.45,22+(m.elong-0.72)*10,18,6));
  slots.push(slot('armR','long','armR', 8,8, 0.55,1.85,0.45,22+(m.elong-0.72)*10,18,7));
  slots.push(slot('cheekL','round','body',-R*0.50,R*0.08,0,1,0.9,R*0.24,23,8));
  slots.push(slot('cheekR','round','body', R*0.50,R*0.08,0,1,0.9,R*0.24,23,9));
  // extra rim spikes when spiky
  const extra=Math.round(m.spike*6);
  for(let i=0;i<extra;i++){
    const a=-Math.PI*0.85+i*(Math.PI*1.7/Math.max(1,extra-1||1));
    // skip front-bottom a bit
    slots.push(slot('rim'+i,'spiky','body',Math.cos(a)*R*0.9,Math.sin(a)*R*0.9,a+Math.PI/2,0.65,1.3,18+m.spike*8,25,10+i));
  }
  return slots;
}

function krakenSlots(design){
  const m=design.morph, R=design.headR;
  const slots=[];
  slots.push(slot('head','round','mantle',0,-4,0,1.02,1.0,R*1.0,40,1));
  slots.push(slot('crown','spiky','mantle',0,-R*0.9,0,0.8,1.4,32+m.spike*12,50,30));
  // 2–3 big stretched segments per arm, thick enough to BE the arm
  design.tent.forEach((te,i)=>{
    const ts=[0.22,0.52,0.82];
    ts.forEach((tt,k)=>{
      const p=spineAt(te.spine,tt);
      const isFront=(i===3||i===4||i===0||i===7);
      const r=(k===0?40:k===1?32:24);
      const sx=(k===0?2.15:k===1?2.0:1.7);
      const sy=(k===0?0.85:k===1?0.72:0.6);
      const pri=2+k*8+i*0.01; // fill a base on every arm before mids, then tips
      slots.push(slot('t'+i+'s'+k,'long',te.id,p.x,p.y,p.rot,sx,sy,r, 10+(isFront?24:0)+k, pri));
    });
  });
  return slots;
}

function assignParts(scheme, parts, design){
  if(scheme==='orb') return assignBySlots(orbSlots(design), parts);
  if(scheme==='trex') return assignTrex(parts, design);
  return assignKraken(parts, design);
}

function makeTaker(pool, used){
  const fallback={
    round:['lumpy','decor','long','spiky'],
    lumpy:['round','decor','spiky','long'],
    long:['decor','lumpy','spiky','round'],
    spiky:['decor','lumpy','long','round'],
    decor:['round','lumpy','spiky','long']
  };
  return function takeFor(cls){
    const want={
      round:{minRound:.55,roundness:.8},
      lumpy:{roundness:.4,spikiness:.3},
      long:{minElong:1.4,elongation:1.8},
      spiky:{minSpike:.5,spikiness:.8},
      decor:{}
    }[cls]||{};
    const prefer=pool.filter(p=>!used.has(p.i) && p.cls===cls);
    if(prefer.length){
      const p=takeBest(prefer,want);
      if(p){used.add(p.i);return p;}
    }
    const chain=fallback[cls]||['decor'];
    for(const k of chain){
      const cand=pool.filter(p=>!used.has(p.i) && p.cls===k);
      if(cand.length){
        const p=takeBest(cand,want);
        if(p){used.add(p.i);return p;}
      }
    }
    const rest=pool.filter(p=>!used.has(p.i));
    if(rest.length){
      const p=takeBest(rest,want);
      if(p){used.add(p.i);return p;}
    }
    return null;
  };
}

function assignBySlots(slots, parts){
  const pool=(parts||[]).map((p,i)=>({...p,i,cls:classifyPart(p)}));
  slots.sort((a,b)=>a.pri-b.pri);
  const placed=[];
  const used=new Set();
  const takeFor=makeTaker(pool, used);
  slots.forEach(sl=>{
    const p=takeFor(sl.cls);
    if(!p)return;
    const sz=(p.traits&&p.traits.size)||1;
    const slot2=Object.assign({},sl,{r:sl.r*(0.88+0.24*(sz-0.7))});
    placed.push({part:p,slot:slot2});
  });
  return placed;
}

function assignTrex(parts, design){
  const m=design.morph, F=m.fat;
  const core=trexSlots(design);
  const pool=(parts||[]).map((p,i)=>({...p,i,cls:classifyPart(p)}));
  const used=new Set();
  const takeFor=makeTaker(pool, used);
  const placed=[];
  const leftover=()=>pool.filter(p=>!used.has(p.i));
  function bulk(p){
    const t=p.traits||{};
    let s=(t.size||1)*(0.85+(t.roundness||0.3));
    if(p.cls==='round')s+=0.45;
    if(p.cls==='lumpy')s+=0.2;
    if(p.type===12)s-=0.9;
    return s;
  }
  function takeBulk(cls){
    const cand=pool.filter(p=>!used.has(p.i));
    if(!cand.length)return null;
    const prefer=cls?cand.filter(p=>p.cls===cls):cand;
    const list=prefer.length?prefer:cand;
    list.sort((a,b)=>bulk(b)-bulk(a));
    const p=list[0];
    used.add(p.i);
    return p;
  }
  function put(id, p){
    if(!p)return;
    const sl=core.find(s=>s.id===id);
    if(!sl)return;
    const sz=(p.traits&&p.traits.size)||1;
    placed.push({part:p, slot:Object.assign({},sl,{r:sl.r*(0.92+0.16*(sz-0.7))})});
  }
  // Biggest / roundest shape IS the torso, deformed into the pear (orb-style).
  put('torso', takeBulk('round')||takeFor('round'));
  put('head', takeBulk('round')||takeFor('round'));
  // Thighs then shins — lumpy/chunky, aligned to the leg bones.
  put('thighN', takeFor('lumpy'));
  put('thighF', takeFor('lumpy'));
  put('shinN', takeFor('lumpy'));
  put('shinF', takeFor('lumpy'));
  // Tail segments along the spine (already bone-aligned).
  core.filter(s=>s.id.startsWith('tail')).sort((a,b)=>a.pri-b.pri).forEach(sl=>{
    const p=takeFor('long');
    if(!p)return;
    const sz=(p.traits&&p.traits.size)||1;
    placed.push({part:p, slot:Object.assign({},sl,{r:sl.r*(0.92+0.16*(sz-0.7))})});
  });
  // Leftovers: back-spike row (pointing out from the spine) or an extra tail tip. Nothing piled on the torso.
  const restSp=leftover().filter(p=>p.cls==='spiky');
  const maxSp=Math.max(0, Math.min(5, restSp.length?Math.min(5, restSp.length): (m.spike>0.55?2:0)));
  for(let i=0;i<maxSp;i++){
    const rest=leftover();
    if(!rest.length)break;
    const spikes=rest.filter(p=>p.cls==='spiky');
    const p=spikes.length?takeBest(spikes,{minSpike:.5,spikiness:.8}):null;
    if(!p)break;
    if(!used.has(p.i))used.add(p.i);
    const tt=maxSp<=1?0.5:i/(maxSp-1);
    // along the back of the pear, pointing outward (perpendicular to the body axis)
    const x=-30+tt*48;
    const y=-50-F*6;
    placed.push({part:p, slot:slot('spike'+i,'spiky','torso',x,y,-Math.PI/2+0.08, 0.7, 1.35, 22+m.spike*8, 36, 16+i)});
  }
  // leftover longs → extra tail tip, aligned to the spine
  const longs=leftover().filter(p=>p.cls==='long');
  if(longs.length){
    const p=takeFor('long');
    const spine=sampleCurve(design.tail,6);
    const tip=spineAt(spine, 0.92);
    if(p) placed.push({part:p, slot:slot('tailTip','long','tail',tip.x,tip.y,tip.rot,1.8,0.55,22,11,18)});
  }
  // tiny arm only if something is still left
  const armSl=core.find(s=>s.id==='arm');
  if(armSl && leftover().length){
    const p=takeFor('long')||takeFor('decor');
    if(p) placed.push({part:p, slot:armSl});
  }
  return placed;
}

function assignKraken(parts, design){
  const m=design.morph, R=design.headR;
  const pool=(parts||[]).map((p,i)=>({...p,i,cls:classifyPart(p)}));
  const used=new Set();
  const takeFor=makeTaker(pool, used);
  const placed=[];
  const leftover=()=>pool.filter(p=>!used.has(p.i));
  // Head IS the largest / roundest caught shape, orb-style
  const headP=takeFor('round');
  if(headP){
    placed.push({part:headP, slot:slot('head','round','mantle',0,-4,0,1.02,1.0,R*1.0,40,1)});
  }
  // Distribute remaining parts as thick arm segments (base → mid → tip across arms)
  const armOrder=[3,4,2,5,1,6,0,7]; // hanging first, then sides, waves last
  const ts=[0.22,0.52,0.82];
  const sizes=[
    {sx:2.2, sy:0.88, r:42},
    {sx:2.05,sy:0.74, r:34},
    {sx:1.75,sy:0.62, r:26}
  ];
  for(let k=0;k<3;k++){
    for(const i of armOrder){
      if(!leftover().length)break;
      const te=design.tent[i];
      if(!te)continue;
      const pnt=spineAt(te.spine, ts[k]);
      // prefer long for arms; anything leftover still stretches into a segment
      const longs=leftover().filter(p=>p.cls==='long');
      const p=longs.length?takeBest(longs,{minElong:1.4,elongation:1.8}):takeFor('long');
      if(!p)continue;
      if(!used.has(p.i))used.add(p.i);
      const sz=sizes[k];
      const isFront=(i===3||i===4||i===2||i===5);
      placed.push({part:p, slot:slot('t'+i+'s'+k,'long',te.id,pnt.x,pnt.y,pnt.rot,sz.sx,sz.sy,sz.r, 10+(isFront?24:0)+k, 2)});
    }
  }
  // A few large crown spikes only — no sticker scatter on the head
  const maxCrown=Math.min(3, leftover().filter(p=>p.cls==='spiky').length);
  for(let i=0;i<maxCrown;i++){
    const p=takeFor('spiky');
    if(!p)break;
    const ang=-Math.PI/2+(i-(maxCrown-1)/2)*0.45;
    placed.push({part:p, slot:slot('crown'+i,'spiky','mantle',Math.cos(ang)*R*0.82,Math.sin(ang)*R*0.82,ang+Math.PI/2,0.75,1.35, 28+m.spike*10, 50, 8)});
  }
  return placed;
}

function eyeSlots(scheme, design){
  const m=design.morph, F=m.fat;
  if(scheme==='orb'){
    const R=design.bodyR;
    return [{bone:'body',x:0,y:-R*0.06,r:Math.max(48, R*0.48),look:1}];
  }
  if(scheme==='trex') return [
    {bone:'head',x:10,y:-42,r:17,look:1},
    {bone:'head',x:40,y:-38,r:16,look:1}
  ];
  const R=design.headR;
  return [
    {bone:'mantle',x:-R*0.38,y:-R*0.08,r:Math.max(18,R*0.28),look:1},
    {bone:'mantle',x: R*0.38,y:-R*0.08,r:Math.max(18,R*0.28),look:1}
  ];
}

function fitOf(bbox,W,H){
  const margin=32;
  const bw=bbox.maxX-bbox.minX, bh=bbox.maxY-bbox.minY;
  const s=Math.min((W-2*margin)/bw,(H-2*margin-18)/bh);
  const cx=(bbox.minX+bbox.maxX)/2, cy=(bbox.minY+bbox.maxY)/2;
  return {s, tx:W/2-cx*s, ty:H*0.50-cy*s};
}
function applyFit(c,fit,tilt){
  c.translate(fit.tx,fit.ty);
  c.scale(fit.s,fit.s);
  c.rotate(tilt||0);
}

function layoutParts(parts){
  const scheme=pickScheme(parts);
  const color=dominantColor(parts);
  const morph=traitsMorph(parts);
  const design=scheme==='trex'?trexDesign(morph):scheme==='orb'?orbDesign(morph):krakenDesign(morph);
  const pal=palFrom(color);
  const decals=assignParts(scheme,parts,design);
  const eyes=eyeSlots(scheme,design);
  return {parts:(parts||[]).slice(), scheme, color, pal, design, decals, eyes, body:null, morph};
}

function drawGoogly(c,x,y,r,t,reduced){
  const look=reduced?0.12:Math.sin((t||0)/700)*0.18;
  c.save();
  c.fillStyle='#fffdf7';
  c.strokeStyle='#1c2836';
  c.lineWidth=Math.max(2,r*.1);
  c.beginPath();c.ellipse(x,y,r,r*1.06,0,0,Math.PI*2);c.fill();c.stroke();
  const px=x+r*look, py=y+r*.12;
  c.fillStyle='#1a2430';
  c.beginPath();c.arc(px,py,r*.45,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.arc(px+r*.14,py-r*.16,r*.15,0,Math.PI*2);c.fill();
  c.restore();
}

function drawPlacedPart(c, d, bones, t, reduced, progress, design){
  const sl=d.slot, p=d.part;
  const delay=Math.min(0.65,(p.i!=null?p.i:0)*0.032);
  const local=Math.max(0,Math.min(1,(progress*950-delay*950)/950));
  const ease=1-Math.pow(1-local,3);
  if(ease<=0)return;
  const assembled=progress>=1;
  const bw=boneWorld(bones,sl.bone,assembled?t:0,reduced||progress<1);
  const cs=Math.cos(bw.rot),sn=Math.sin(bw.rot);
  const wx=bw.x+sl.x*cs-sl.y*sn;
  const wy=bw.y+sl.x*sn+sl.y*cs;
  const ang=bw.rot+sl.rot;
  const y0=design.bbox.maxY+90;
  const x=wx, y=y0+(wy-y0)*ease;
  c.save();
  c.translate(x,y);
  c.rotate(ang);
  c.scale(sl.sx||1,sl.sy||1);
  c.globalAlpha=0.55+0.45*ease;
  drawBodyPart(c,p,sl.r);
  c.globalAlpha=1;
  c.restore();
}

function drawCreature(c,W,H,layout,t,reduced,progress){
  const {pal,design,decals,eyes,scheme}=layout;
  const fit=fitOf(design.bbox,W,H);
  const assembled=progress>=1;
  const rise=1-Math.pow(1-Math.min(1,progress),3);
  c.save();
  if(progress<1)c.translate(0,(1-rise)*(H*0.55));
  applyFit(c,fit,design.tilt);
  const bones=design.bones;
  const tt=assembled?t:0;
  const red=reduced||progress<1;
  // shadow
  const sh=design.shadow;
  c.save();
  c.fillStyle='rgba(30,22,40,'+(0.2*rise)+')';
  c.beginPath();c.ellipse(sh.x,sh.y,sh.rx,sh.ry,0,0,Math.PI*2);c.fill();
  c.restore();

  // connective tissue first (always, so 3-part stays readable)
  if(scheme==='trex'){
    drawTrexTissue(c,pal,bones,tt,red,design);
    drawTrexJaw(c,pal,bones,tt,red,design);
  } else if(scheme==='orb'){
    drawOrbTissue(c,pal,bones,tt,red,design);
  } else {
    drawKrakenTissue(c,pal,bones,tt,red,design);
  }

  // body parts in z-order
  const ordered=decals.slice().sort((a,b)=>(a.slot.z||0)-(b.slot.z||0));
  ordered.forEach(d=>drawPlacedPart(c,d,bones,t,reduced,progress,design));

  // re-draw mandatory features so they stay readable over parts
  if(scheme==='trex') drawTrexJaw(c,pal,bones,tt,red,design);

  // eyes
  const eyeT=reduced?(progress>=1?1:0):Math.max(0,Math.min(1,(progress-0.72)/0.22));
  if(eyeT>0){
    eyes.forEach((e,i)=>{
      const bw=boneWorld(bones,e.bone,tt,red);
      const cs=Math.cos(bw.rot),sn=Math.sin(bw.rot);
      const ex=bw.x+e.x*cs-e.y*sn;
      const ey=bw.y+e.x*sn+e.y*cs;
      drawGoogly(c,ex,ey,e.r*eyeT,t+i*200,reduced);
    });
  }
  c.restore();
}

function finish(){
  if(!running)return;
  running=false;
  cancelAnimationFrame(raf);
  $('hud').classList.add('hidden');
  $('result').classList.remove('hidden');

  const layout=layoutParts(caught);
  $('creatureName').textContent=makeName(caught, layout.scheme);
  $('creatureDesc').textContent=
    'Поймано деталей: '+caught.length+'. Все детали — твоя добыча!';
  $('rarity').textContent=caught.length>=13?'редкий экземпляр':
    caught.length>=8?'необычный экземпляр':'первое поколение';

  $('legend').replaceChildren();
  caught.forEach(p=>{
    const dot=document.createElement('span');
    dot.className='dot';dot.style.background=p.color;
    dot.title=p.label||'';$('legend').appendChild(dot);
  });

  cancelAnimationFrame(resultRaf);
  const t0=performance.now();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration=reduced?0:950;

  function draw(now){
    const W=creature.width,H=creature.height;
    const progress=Math.min(1,(now-t0)/duration||1);
    cc.clearRect(0,0,W,H);
    const bg=cc.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#fffaf0');bg.addColorStop(1,'#f0dfc7');
    cc.fillStyle=bg;cc.fillRect(0,0,W,H);
    drawCreature(cc,W,H,layout,now-t0,reduced,progress);
    $('animationNote').textContent=progress<1?
      'Детали собираются вместе…':'Готово! Оно живое?!';
    if(progress<1||!reduced)resultRaf=requestAnimationFrame(draw);
  }
  resultRaf=requestAnimationFrame(draw);
}

function randomCaught(n, seed){
  const r=mulberry(seed==null?((Math.random()*1e9)|0):seed);
  const out=[];
  for(let i=0;i<n;i++){
    const isKrak=r()<0.48;
    let part;
    if(isKrak){
      const hold=Math.random;
      Math.random=r;
      part=makeKrako();
      Math.random=hold;
      part.type=-1;
      part.traits.size=1;
    } else {
      const type=(r()*GEO.length)|0;
      const g=GEO[type];
      part={type,kind:null,pts:null,label:g.name,
        traits:{roundness:g.roundness,spikiness:g.spikiness,elongation:g.elongation,size:1}};
    }
    part.color=colors[(r()*colors.length)|0];
    part.rot=r()*6.28;
    part.i=i;
    out.push(part);
  }
  return out;
}

function biasedCaught(n, seed, bias){
  // bias: 'spiky' | 'round' | 'long' | 'mixed'
  const r=mulberry(seed==null?1:seed);
  const kinds={
    spiky:['spiky','zigzag',3,2,7,10],
    round:['blob',0,4,8,9,11],
    long:['worm',14],
    lumpy:['lumpy',1,5,6,13]
  };
  const bag=kinds[bias]||null;
  const out=[];
  for(let i=0;i<n;i++){
    let part;
    const hold=Math.random;Math.random=r;
    if(!bag){
      part=r()<0.5?makeKrako():null;
      if(part){part.type=-1;part.traits.size=1;}
    } else {
      const pickOne=bag[(r()*bag.length)|0];
      if(typeof pickOne==='string'){
        // force kind by retrying makeKrako a few times
        let tries=0;
        do{part=makeKrako();tries++;}while(part.kind!==pickOne && tries<12);
        part.type=-1;part.traits.size=1;
      } else {
        const g=GEO[pickOne];
        part={type:pickOne,kind:null,pts:null,label:g.name,
          traits:{roundness:g.roundness,spikiness:g.spikiness,elongation:g.elongation,size:1}};
      }
    }
    Math.random=hold;
    if(!part){
      const type=(r()*GEO.length)|0,g=GEO[type];
      part={type,kind:null,pts:null,label:g.name,
        traits:{roundness:g.roundness,spikiness:g.spikiness,elongation:g.elongation,size:1}};
    }
    part.color=colors[(r()*colors.length)|0];
    part.rot=r()*6.28;
    part.i=i;
    out.push(part);
  }
  return out;
}

window.__forceScheme=null;
const _pickScheme=pickScheme;
pickScheme=function(parts){
  if(window.__forceScheme)return window.__forceScheme;
  return _pickScheme(parts);
};

window.__testAssemble={
  randomCaught,
  biasedCaught,
  draw(ctx,W,H,parts,scheme,time,reduced,progress){
    const hold=window.__forceScheme;
    window.__forceScheme=scheme;
    const layout=layoutParts(parts);
    window.__forceScheme=hold;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#fffaf0';ctx.fillRect(0,0,W,H);
    drawCreature(ctx,W,H,layout,time||0,!!reduced,progress==null?1:progress);
    return layout;
  },
  showResult(parts,scheme){
    caught=parts.slice();
    window.__forceScheme=scheme;
    cancelAnimationFrame(raf);
    cancelAnimationFrame(introRaf);
    $('intro').classList.add('hidden');
    $('hud').classList.add('hidden');
    running=true;
    finish();
  }
};
function start() {
  cancelAnimationFrame(raf);
  cancelAnimationFrame(resultRaf);
  cancelAnimationFrame(introRaf);
  targets=[];sparks=[];caught=[];
  elapsed=0;spawnClock=0;running=true;

}

function drawIntroMascot(c,x,y,s,t) {

function drawIntro(t,reduced) {
  ic.clearRect(0,0,introW,introH);
  introFloaters.forEach(f=>{
    if(!reduced){
      f.x+=f.vx*0.016;f.y+=f.vy*0.016;f.rot+=f.spin*0.016;
      if(f.x<-.1)f.x=1.1;if(f.x>1.1)f.x=-.1;
      if(f.y<-.1)f.y=1.1;if(f.y>1.1)f.y=-.1;
    }
    const px=f.x*introW, py=f.y*introH;
    ic.globalAlpha=.55;
    drawToken(ic,f,px,py,f.r,f.rot);
    ic.globalAlpha=1;
  });
  const stage=$('introStage').getBoundingClientRect();
  const root=introCanvas.getBoundingClientRect();
  const mx=stage.left-root.left+stage.width/2;
  const my=stage.top-root.top+stage.height/2;
  const s=Math.min(stage.width,stage.height)*.34;
  drawIntroMascot(ic,mx,my,Math.max(70,s), reduced?0:t);
}

function startIntro() {
  cancelAnimationFrame(introRaf);
  initFloaters();
  resizeIntro();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0=performance.now();
  function loop(now){
    if($('intro').classList.contains('hidden'))return;
    drawIntro(reduced?0:(now-t0)/1000,reduced);
    introRaf=requestAnimationFrame(loop);
  }
  drawIntro(0,reduced);
  introRaf=requestAnimationFrame(loop);
}

startIntro();

})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(()=>{});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !reloaded) { reloaded = true; location.reload(); }
    });
  });
}
</script>
