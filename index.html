<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17283b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Собери монстра">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
<title>Собери монстра</title>
<style>
:root {
  --coral:#ff715f;
  --cream:#fff3df;
  --night:#17283b;
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
}
* { box-sizing:border-box; }
html,body {
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--night);color:white;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
*,*::before,*::after {
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
button { font:inherit; -webkit-appearance:none; }
#game {
  position:relative;width:100%;height:100%;
  height:100dvh;overflow:hidden;
  background:linear-gradient(135deg,#142b3b,#202b46 55%,#392846);
}
canvas#field {
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;
}
.hud {
  position:absolute;inset:0;z-index:2;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 14px
    calc(env(safe-area-inset-bottom) + 16px);
  pointer-events:none;
}
.top { display:flex;justify-content:space-between;gap:10px; }
.stat {
  min-width:105px;padding:10px 13px;border-radius:17px;
  background:#172c42d9;border:1px solid #ffffff35;
  backdrop-filter:blur(12px);
}
.label {
  font-size:10px;font-weight:900;letter-spacing:.12em;
  text-transform:uppercase;color:#b6c6d5;
}
.value {font-size:28px;font-weight:950;line-height:1.2}
.track {height:6px;background:#ffffff25;border-radius:8px;margin-top:7px;overflow:hidden}
#meter {height:100%;width:0;background:linear-gradient(90deg,#77d9bd,#ffd16d,#ff715f)}
.hint {
  align-self:center;text-align:center;padding:10px 15px;
  border-radius:30px;background:#17283bdc;border:1px solid #ffffff35;
  font-size:12px;max-width:95%;
}
.screen {
  position:absolute;inset:0;z-index:5;
  display:grid;place-items:center;padding:12px;
  background:#09121edb;backdrop-filter:blur(12px);
}
#intro.screen {
  display:block;padding:0;background:transparent;backdrop-filter:none;
}
#introArt {
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;display:block;
}
.intro-ui {
  position:relative;z-index:2;
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sat) + 22px) 22px calc(var(--sab) + 22px);
  box-sizing:border-box;
}
.intro-ui h1 {
  margin:0;text-align:center;
  font-size:clamp(52px,15vw,80px);line-height:.86;
  letter-spacing:-.07em;font-weight:900;color:#fff6e8;
  text-shadow:0 4px 0 #c84c43,0 12px 32px #00066;
  pointer-events:none;
}
.intro-stage {flex:1;width:100%;min-height:180px;pointer-events:none}
.intro-rules {
  margin:0 12px 16px;max-width:22em;text-align:center;
  font-size:15px;line-height:1.45;font-weight:650;color:#e7eef5;
  text-shadow:0 2px 14px #000a;
  pointer-events:none;
}
#intro .primary {
  width:min(100%,360px);padding:18px 28px;
  font-size:22px;border-radius:20px;margin-top:0;
  pointer-events:auto;
}
.hidden {display:none!important}
.panel {
  width:min(560px,100%);max-height:100%;
  overflow:auto;text-align:center;color:#243247;
  padding:clamp(20px,5vw,36px);border-radius:26px;
  background:linear-gradient(145deg,#fff8eb,#f1e3cf);
  box-shadow:0 25px 80px #0007;
}
.logo {
  width:68px;height:68px;margin:auto;border-radius:22px;
  display:grid;place-items:center;font-size:38px;
  background:#ffe5c4;
}
.kicker {font-size:10px;font-weight:950;letter-spacing:.2em;color:#df6a58}
h1 {font-size:clamp(44px,11vw,66px);line-height:.9;letter-spacing:-.06em;margin:12px 0}
h2 {font-size:clamp(28px,7vw,46px);line-height:1;margin:10px 0}
.panel p {font-size:14px;line-height:1.5;color:#617083}
.muted {font-size:12px!important;color:#8993a0!important}
.primary {
  display:inline-block;border:0;border-radius:16px;
  padding:15px 24px;margin-top:12px;
  background:linear-gradient(#ff806b,#f26052);
  color:white;font-size:17px;font-weight:900;
  box-shadow:0 5px 0 #c84c43,0 10px 24px #e65d4f44;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.primary:active {transform:translateY(3px);box-shadow:0 2px 0 #c84c43}
.primary:focus-visible {outline:3px solid #348bd2;outline-offset:4px}
.resultPanel {width:min(900px,100%);padding:14px}
#creature {
  display:block;width:100%;height:auto;
  aspect-ratio:600/700;
  max-height:min(52vh,520px);min-height:220px;
  border-radius:18px;background:#fff4e2;border:1px solid #fff;
}
.stamp {
  display:inline-block;padding:7px 12px;border-radius:30px;
  background:#21364a;color:white;font-size:10px;font-weight:900;
}
#legend {display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
.dot {width:12px;height:12px;border:2px solid white;border-radius:50%}
#animationNote {font-size:11px;color:#9b8066;min-height:16px}
@media(max-height:650px) {
  .panel {padding:14px}
  .logo {width:48px;height:48px;font-size:27px}
  h1 {font-size:42px}
  #creature {max-height:40vh;min-height:170px}
  .primary {padding:12px 20px}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="field"></canvas>

  <div class="hud hidden" id="hud">
    <div class="top">
      <div class="stat">
        <div class="label">Поймано</div>
        <div class="value"><span id="score">0</span> / 15</div>
        <div class="track"><div id="meter"></div></div>
      </div>
      <div class="stat" style="text-align:right">
        <div class="label">Время</div>
        <div class="value" id="timer">30</div>
      </div>
    </div>
    <div class="hint" id="hint">Лови детали — собери своего монстра!</div>
  </div>

  <section class="screen" id="intro">
    <canvas id="introArt"></canvas>
    <div class="intro-ui">
      <h1>Собери<br>монстра</h1>
      <div class="intro-stage" id="introStage" aria-hidden="true"></div>
      <p class="intro-rules">30 секунд. Лови детали — из них соберётся твой монстр.</p>
      <button class="primary" id="startBtn" type="button">Играть</button>
    </div>
  </section>

  <section class="screen hidden" id="result">
    <div class="panel resultPanel">
      <span class="stamp">Экземпляр создан</span>
      <span class="stamp" id="rarity">новый вид</span>
      <h2 id="creatureName">Неизвестный монстр</h2>
      <canvas id="creature" width="600" height="700"></canvas>
      <p id="creatureDesc"></p>
      <div id="legend"></div>
      <p id="animationNote">Собираем твоего монстра…</p>
      <button class="primary" id="againBtn" type="button">Собрать ещё монстра</button>
      <p class="muted">Из твоих деталей. Глазки — подарок от фабрики.</p>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const field = $('field');
const ctx = field.getContext('2d');
const creature = $('creature');
const cc = creature.getContext('2d');
const introCanvas=$('introArt');
const ic=introCanvas.getContext('2d');
let introRaf=0,introW=0,introH=0,introDpr=1,introFloaters=[];

const ROUND = 30, GOAL = 15;
const GEO = [
  {name:'круг',           roundness:1,   spikiness:0,    elongation:1},
  {name:'квадрат',        roundness:.35, spikiness:.15,  elongation:1},
  {name:'треугольник',    roundness:.2,  spikiness:.55,  elongation:1.1},
  {name:'звезда',         roundness:.12, spikiness:.95,  elongation:1},
  {name:'сердце',         roundness:.7,  spikiness:.12,  elongation:1.1},
  {name:'ромб',           roundness:.3,  spikiness:.4,   elongation:1.45},
  {name:'шестиугольник',  roundness:.55, spikiness:.2,   elongation:1},
  {name:'молния',         roundness:.08, spikiness:.85,  elongation:1.85},
  {name:'облако',         roundness:.88, spikiness:0,    elongation:1.35},
  {name:'пончик',         roundness:1,   spikiness:0,    elongation:1},
  {name:'крестик',        roundness:.18, spikiness:.5,   elongation:1},
  {name:'полумесяц',      roundness:.7,  spikiness:.18,  elongation:1.2},
  {name:'цветок',         roundness:.55, spikiness:.35,  elongation:1},
  {name:'пятиугольник',   roundness:.5,  spikiness:.25,  elongation:1},
  {name:'стрелка',        roundness:.12, spikiness:.6,   elongation:1.7}
];
const colors = ['#ff7564','#ffd16d','#70d4b4','#75c5f2',
 '#bd98ef','#f28eb5','#f39b43','#a5d85e'];

let w=0,h=0,dpr=1;
let targets=[],caught=[],sparks=[];
let running=false,elapsed=0,spawnClock=0,last=0,raf=0,resultRaf=0;
let pointerActive=true;

function cssPx(name) {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name))||0;
}
function playBounds() {
  const top=Math.max(80, cssPx('--sat')+108);
  const bottom=Math.min(h-24, h-(cssPx('--sab')+70));
  return {
    left:16, right:w-16, top, bottom,
    cx:(16+w-16)/2, cy:(top+bottom)/2
  };
}

function resize() {
  w=window.innerWidth; h=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  field.width=Math.round(w*dpr);
  field.height=Math.round(h*dpr);
  field.style.width=w+'px';
  field.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  resizeIntro();
}
window.addEventListener('resize',resize);
resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function mulberry(seed) {
  let s=(seed>>>0)||1;
  return () => {
    s+=0x6D2B79F5;
    let t=Math.imul(s^(s>>>15),1|s);
    t^=t+Math.imul(t^(t>>>7),61|t);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function hash01(a,b){ return ((Math.imul((a+3)|0,0x45d9f3b)^(b*1103515245))>>>16)/65535; }

function ribbon(line, half) {
  const left=[], right=[];
  for(let i=0;i<line.length;i++){
    const p=line[i];
    const q=line[i<line.length-1?i+1:i-1];
    let dx=q[0]-p[0], dy=q[1]-p[1], len=Math.hypot(dx,dy)||1;
    const nx=-dy/len*half, ny=dx/len*half;
    left.push([p[0]+nx,p[1]+ny]);
    right.push([p[0]-nx,p[1]-ny]);
  }
  return left.concat(right.reverse());
}
function normalizePts(pts) {
  let max=0.001;
  pts.forEach(p=>{ const d=Math.hypot(p[0],p[1]); if(d>max)max=d; });
  return pts.map(p=>[p[0]/max,p[1]/max]);
}

function makeKrako() {
  const seed=(Math.random()*0x7fffffff)|0;
  const r=mulberry(seed);
  const kind=pick(['blob','zigzag','worm','lumpy','spiky']);
  let pts, traits, smooth=false, label;
  if(kind==='blob'){
    const n=10+(r()*8|0), ph=r()*Math.PI*2;
    pts=[];
    for(let i=0;i<n;i++){
      const a=ph+i/n*Math.PI*2;
      const rad=.58+r()*.5;
      pts.push([Math.cos(a)*rad, Math.sin(a)*rad]);
    }
    traits={roundness:.72+r()*.22, spikiness:.08+r()*.22, elongation:.9+r()*.35};
    smooth=true;
    label=pick(['клякса','пузырь','капля','комок','пятно']);
  } else if(kind==='zigzag'){
    const segs=6+(r()*5|0), half=.16+r()*.12;
    const up=[], dn=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs, x=-1+t*2;
      const y=((i%2)?1:-1)*(.4+r()*.4);
      up.push([x,y+half]); dn.push([x,y-half]);
    }
    pts=up.concat(dn.reverse());
    traits={roundness:.1, spikiness:.55+r()*.25, elongation:1.55+r()*.5};
    label=pick(['зигзаг','излом','шеврон','ломаная']);
  } else if(kind==='worm'){
    const segs=8+(r()*7|0), amp=.22+r()*.38, freq=1.1+r()*2.2, thick=.15+r()*.14;
    const ph=r()*Math.PI*2, line=[];
    for(let i=0;i<=segs;i++){
      const t=i/segs;
      line.push([-0.98+t*1.96, Math.sin(t*freq*Math.PI*2+ph)*amp]);
    }
    pts=ribbon(line, thick);
    traits={roundness:.42, spikiness:.05+r()*.1, elongation:1.8+r()*.7};
    smooth=true;
    label=pick(['червяк','извилина','хвостик','спиралька','вьюнок']);
  } else if(kind==='lumpy'){
    const n=5+(r()*5|0), ph=r()*Math.PI*2;
    pts=[];
    for(let i=0;i<n;i++){
      const a=ph+i/n*Math.PI*2+(r()-.5)*.28;
      pts.push([Math.cos(a)*(.42+r()*.7), Math.sin(a)*(.42+r()*.7)]);
    }
    traits={roundness:.3+r()*.3, spikiness:.22+r()*.3, elongation:.85+r()*.55};
    label=pick(['коряга','бугор','глыба','урод','кракозябра']);
  } else {
    const spikes=5+(r()*8|0), ph=-Math.PI/2+(r()-.5)*.5;
    pts=[];
    for(let i=0;i<spikes;i++){
      const a0=ph+i/spikes*Math.PI*2;
      const a1=ph+(i+.5)/spikes*Math.PI*2;
      pts.push([Math.cos(a0)*(.7+r()*.5), Math.sin(a0)*(.7+r()*.5)]);
      pts.push([Math.cos(a1)*(.16+r()*.26), Math.sin(a1)*(.16+r()*.26)]);
    }
    traits={roundness:.08, spikiness:.8+r()*.2, elongation:.9+r()*.35};
    label=pick(['колючка','ёж','шип','иголка','колючка']);
  }
  pts=normalizePts(pts);
  traits.size=1;
  return {kind, seed, pts, traits, label, smooth};
}

function shape(c,t,x,y,r) {
  c.beginPath();
  switch(t) {
    case 0: c.arc(x,y,r,0,Math.PI*2); break;
    case 1: c.rect(x-r*.78,y-r*.78,r*1.56,r*1.56); break;
    case 2:
      c.moveTo(x,y-r);c.lineTo(x-r*.92,y+r*.76);
      c.lineTo(x+r*.92,y+r*.76);c.closePath();break;
    case 3:
      for(let i=0;i<10;i++){
        let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;
        let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 4:
      c.moveTo(x,y+r*.85);
      c.bezierCurveTo(x-r*1.45,y+r*.05,x-r*1.05,y-r*.95,x-r*.38,y-r*.72);
      c.bezierCurveTo(x-r*.05,y-r*.58,x,y-r*.3,x,y-r*.3);
      c.bezierCurveTo(x,y-r*.3,x+r*.05,y-r*.58,x+r*.38,y-r*.72);
      c.bezierCurveTo(x+r*1.05,y-r*.95,x+r*1.45,y+r*.05,x,y+r*.85);
      break;
    case 5:
      c.moveTo(x,y-r);c.lineTo(x+r*.8,y);c.lineTo(x,y+r);
      c.lineTo(x-r*.8,y);c.closePath();break;
    case 6:
      for(let i=0;i<6;i++){
        let a=i*Math.PI/3-Math.PI/6,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 7:
      c.moveTo(x+r*.12,y-r);c.lineTo(x-r*.62,y+r*.05);
      c.lineTo(x-r*.12,y+r*.05);c.lineTo(x-r*.3,y+r);
      c.lineTo(x+r*.65,y-r*.18);c.lineTo(x+r*.12,y-r*.18);
      c.closePath();break;
    case 8:
      c.moveTo(x-r*.82,y+r*.42);
      c.bezierCurveTo(x-r*1.12,y+r*.05,x-r*.82,y-r*.45,x-r*.38,y-r*.45);
      c.bezierCurveTo(x-r*.18,y-r*1.08,x+r*.68,y-r*.98,x+r*.72,y-r*.3);
      c.bezierCurveTo(x+r*1.2,y-r*.18,x+r*1.12,y+r*.48,x+r*.62,y+r*.48);
      c.lineTo(x-r*.62,y+r*.48);c.closePath();break;
    case 9:
      c.arc(x,y,r,0,Math.PI*2);c.moveTo(x+r*.43,y);
      c.arc(x,y,r*.43,0,Math.PI*2,true);break;
    case 10: {
      let q=r*.36;
      c.moveTo(x-q,y-r);c.lineTo(x+q,y-r);c.lineTo(x+q,y-q);
      c.lineTo(x+r,y-q);c.lineTo(x+r,y+q);c.lineTo(x+q,y+q);
      c.lineTo(x+q,y+r);c.lineTo(x-q,y+r);c.lineTo(x-q,y+q);
      c.lineTo(x-r,y+q);c.lineTo(x-r,y-q);c.lineTo(x-q,y-q);
      c.closePath();break;
    }
    case 11:
      c.arc(x-r*.12,y,r*.82,-Math.PI*.72,Math.PI*.72);
      c.arc(x+r*.42,y-r*.18,r*.78,Math.PI*.72,-Math.PI*.72,true);
      c.closePath();break;
    case 12:
      for(let i=0;i<8;i++){
        let a=i*Math.PI/4;
        c.moveTo(x+Math.cos(a)*r*.3,y+Math.sin(a)*r*.3);
        c.quadraticCurveTo(x+Math.cos(a)*r*1.25,y+Math.sin(a)*r*1.25,
          x+Math.cos(a+.3)*r*.3,y+Math.sin(a+.3)*r*.3);
      } c.arc(x,y,r*.3,0,Math.PI*2);break;
    case 13:
      for(let i=0;i<5;i++){
        let a=-Math.PI/2+i*Math.PI*2/5;
        let px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
        i?c.lineTo(px,py):c.moveTo(px,py);
      } c.closePath();break;
    case 14:
      c.moveTo(x-r,y-r*.45);c.lineTo(x+r*.05,y-r*.45);
      c.lineTo(x+r*.05,y-r);c.lineTo(x+r,y);
      c.lineTo(x+r*.05,y+r);c.lineTo(x+r*.05,y+r*.45);
      c.lineTo(x-r,y+r*.45);c.closePath();break;
    case 15:
      c.ellipse(x,y,r*.78,r,0,0,Math.PI*2);break;
    case 16:
      c.ellipse(x-r*.43,y,r*.48,r*.62,0,0,Math.PI*2);
      c.ellipse(x+r*.43,y,r*.48,r*.62,0,0,Math.PI*2);break;
    case 17:
      c.moveTo(x-r*.88,y-r*.22);
      c.quadraticCurveTo(x,y-r*.72,x+r*.88,y-r*.22);
      c.quadraticCurveTo(x+r*.68,y+r*.65,x,y+r*.48);
      c.quadraticCurveTo(x-r*.68,y+r*.65,x-r*.88,y-r*.22);
      c.closePath();break;
    case 18:
      c.moveTo(x-r*.55,y+r*.82);c.lineTo(x-r*.58,y+r*.12);
      c.lineTo(x-r*.86,y-r*.42);c.lineTo(x-r*.58,y-r*.38);
      c.lineTo(x-r*.42,y-r*.72);c.lineTo(x-r*.2,y-r*.55);
      c.lineTo(x-r*.12,y-r*.82);c.lineTo(x+r*.1,y-r*.55);
      c.lineTo(x+r*.4,y-r*.72);c.lineTo(x+r*.48,y-r*.12);
      c.lineTo(x+r*.72,y-r*.12);c.lineTo(x+r*.55,y+r*.82);
      c.closePath();break;
    case 19:
      c.moveTo(x-r*.78,y-r*.78);c.lineTo(x+r*.12,y-r*.78);
      c.lineTo(x+r*.22,y+r*.18);
      c.quadraticCurveTo(x+r*.9,y+r*.2,x+r*.92,y+r*.68);
      c.quadraticCurveTo(x+r*.9,y+r*.9,x-r*.82,y+r*.9);
      c.quadraticCurveTo(x-r,y+r*.85,x-r*.9,y+r*.55);
      c.closePath();break;
    case 20:
      c.moveTo(x-r*.72,y-r*.35);c.lineTo(x-r*.42,y-r*.35);
      c.bezierCurveTo(x-r*.22,y-r*.35,x-r*.25,y-r*.82,x,y-r*.82);
      c.bezierCurveTo(x+r*.28,y-r*.82,x+r*.25,y-r*.35,x+r*.45,y-r*.35);
      c.lineTo(x+r*.72,y-r*.35);c.lineTo(x+r*.72,y+r*.35);
      c.lineTo(x+r*.45,y+r*.35);
      c.bezierCurveTo(x+r*.25,y+r*.35,x+r*.28,y+r*.82,x,y+r*.82);
      c.bezierCurveTo(x-r*.25,y+r*.82,x-r*.22,y+r*.35,x-r*.42,y+r*.35);
      c.lineTo(x-r*.72,y+r*.35);c.closePath();break;
    case 21:
      c.moveTo(x-r*.06,y);
      c.bezierCurveTo(x-r*.3,y-r*.72,x-r*.95,y-r*.82,x-r*.9,y-r*.28);
      c.bezierCurveTo(x-r*.86,y+r*.12,x-r*.35,y+r*.18,x,y);
      c.bezierCurveTo(x+r*.35,y+r*.18,x+r*.86,y+r*.12,x+r*.9,y-r*.28);
      c.bezierCurveTo(x+r*.95,y-r*.82,x+r*.3,y-r*.72,x+r*.06,y);
      c.closePath();break;
    case 22:
      c.moveTo(x-r*.75,y-r*.62);
      c.quadraticCurveTo(x,y-r*.25,x+r*.75,y-r*.62);
      c.lineTo(x+r*.55,y+r*.45);
      c.quadraticCurveTo(x,y+r*1.05,x-r*.55,y+r*.45);
      c.closePath();break;
  }
}

function krakPath(c,o,r) {
  const P=o.pts.map(p=>[p[0]*r,p[1]*r]);
  c.beginPath();
  if(o.smooth && P.length>2){
    const last=P[P.length-1];
    c.moveTo((P[0][0]+last[0])/2,(P[0][1]+last[1])/2);
    for(let i=0;i<P.length;i++){
      const n=P[(i+1)%P.length];
      c.quadraticCurveTo(P[i][0],P[i][1],(P[i][0]+n[0])/2,(P[i][1]+n[1])/2);
    }
    c.closePath();
  } else {
    P.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
    c.closePath();
  }
}

function drawToken(c,o,x,y,r,angle=0) {
  c.save();c.translate(x,y);c.rotate(angle);
  if(o.flip)c.scale(-1,1);
  c.shadowColor=o.color;c.shadowBlur=r*.35;
  c.fillStyle=o.color;c.strokeStyle='#fffdf7';c.lineWidth=Math.max(1.5,r*.09);
  if(o.kind && o.pts){
    krakPath(c,o,r);
    c.fill();c.stroke();
  } else {
    shape(c,o.type,0,0,r);
    c.fill(o.type===9?'evenodd':'nonzero');c.stroke();
  }
  c.shadowBlur=0;

  if(o.type===15) {
    c.fillStyle='white';c.beginPath();c.ellipse(0,0,r*.52,r*.7,0,0,Math.PI*2);c.fill();
    c.fillStyle='#26364a';c.beginPath();c.arc(r*.1,r*.05,r*.28,0,Math.PI*2);c.fill();
    c.fillStyle='white';c.beginPath();c.arc(r*.18,-r*.06,r*.09,0,Math.PI*2);c.fill();
  }
  if(o.type===16) {
    [-.43,.43].forEach(dx=>{
      c.fillStyle='white';c.beginPath();c.ellipse(r*dx,0,r*.29,r*.4,0,0,Math.PI*2);c.fill();
      c.fillStyle='#26364a';c.beginPath();c.arc(r*dx+r*.03,r*.04,r*.14,0,Math.PI*2);c.fill();
    });
  }
  if(o.type===17) {
    c.fillStyle='white';c.fillRect(-r*.43,-r*.17,r*.86,r*.28);
  }
  c.restore();
}

function speedRange() {
  const short=Math.min(w,h);
  const t=Math.min(1, elapsed/ROUND);
  // Start clearly faster than the old 0.20–0.34*short, ramp to a brisk finish.
  return [(0.32+0.18*t)*short, (0.46+0.24*t)*short];
}

function spawn() {
  const b=playBounds();
  const short=Math.min(w,h);
  const [lo,hi]=speedRange();
  const speed=rand(lo,hi);
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=b.left+8;y=rand(b.top+24,b.bottom-24)}
  if(side===1){x=b.right-8;y=rand(b.top+24,b.bottom-24)}
  if(side===2){x=rand(b.left+24,b.right-24);y=b.top+8}
  if(side===3){x=rand(b.left+24,b.right-24);y=b.bottom-8}
  const tx=rand(b.left+(b.right-b.left)*.28, b.right-(b.right-b.left)*.28);
  const ty=rand(b.top+(b.bottom-b.top)*.28, b.bottom-(b.bottom-b.top)*.28);
  const dx=tx-x,dy=ty-y,len=Math.hypot(dx,dy)||1;
  const rad=short<=520?rand(26,36):rand(22,30);
  const isKrak=Math.random()<0.48;
  let part;
  if(isKrak){
    part=makeKrako();
    part.type=-1;
    part.traits.size=rad/30;
  } else {
    const type=Math.floor(Math.random()*GEO.length);
    const g=GEO[type];
    part={
      type, kind:null, pts:null, label:g.name,
      traits:{
        roundness:g.roundness, spikiness:g.spikiness,
        elongation:g.elongation, size:rad/30
      }
    };
  }
  targets.push({
    ...part,
    x,y,vx:dx/len*speed,vy:dy/len*speed,r:rad,
    color:pick(colors),rot:rand(0,6.28),spin:rand(-1.4,1.4),life:rand(9,14)
  });
}

function burst(x,y,color) {
  for(let i=0;i<9;i++)
    sparks.push({x,y,vx:rand(-130,130),vy:rand(-150,80),
      life:.55,max:.55,color});
}

function background() {
  ctx.clearRect(0,0,w,h);
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#142b3b');g.addColorStop(.5,'#202b46');g.addColorStop(1,'#392846');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let i=0;i<48;i++) {
    const x=(i*137.5%997)/997*w;
    const y=(i*83.7%991)/991*h;
    ctx.globalAlpha=.15+(i%4)*.06;
    ctx.fillStyle='#fff4d9';ctx.beginPath();
    ctx.arc(x,y,i%7===0?1.5:.8,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function update(dt) {
  elapsed+=dt;spawnClock+=dt;
  const interval=targets.length<6?.26:targets.length<8?.42:.7;
  while(spawnClock>interval&&targets.length<9){spawnClock-=interval;spawn()}
  if(targets.length>=9)spawnClock=Math.min(spawnClock,interval);
  const b=playBounds();
  const [lo,hi]=speedRange();
  const aim=(lo+hi)*0.55;
  for(let i=targets.length-1;i>=0;i--) {
    let o=targets[i];
    const sp=Math.hypot(o.vx,o.vy)||1;
    if(sp<aim){
      const k=Math.min(aim/sp, 1+dt*0.55);
      o.vx*=k;o.vy*=k;
    }
    o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.spin*dt;o.life-=dt;
    if(o.y<b.top+o.r&&o.vy<0){o.y=b.top+o.r;o.vy=Math.abs(o.vy)}
    if(o.y>b.bottom-o.r&&o.vy>0){o.y=b.bottom-o.r;o.vy=-Math.abs(o.vy)}
    if(o.life<=0||o.x<-80||o.x>w+80)
      targets.splice(i,1);
  }
  for(let i=sparks.length-1;i>=0;i--) {
    let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    if(p.life<=0)sparks.splice(i,1);
  }
  if(elapsed>=ROUND||caught.length>=GOAL)finish();
}

function render() {
  background();
  targets.forEach(o=>drawToken(ctx,o,o.x,o.y,o.r,o.rot));
  sparks.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function frame(t) {
  if(!running)return;
  const dt=Math.min((t-last)/1000,.04);
  last=t;update(dt);render();
  $('timer').textContent=Math.max(0,Math.ceil(ROUND-elapsed));
  if(running)raf=requestAnimationFrame(frame);
}

function catchAt(x,y) {
  if(!running)return;
  for(let i=targets.length-1;i>=0;i--) {
    const o=targets[i];
    if((x-o.x)**2+(y-o.y)**2<(o.r*1.35+24)**2) {
      targets.splice(i,1);
      caught.push({
        type:o.type, kind:o.kind, pts:o.pts, smooth:o.smooth,
        seed:o.seed, label:o.label, traits:{...o.traits},
        color:o.color, rot:o.rot
      });
      burst(o.x,o.y,o.color);
      $('score').textContent=caught.length;
      $('meter').style.width=(caught.length/GOAL*100)+'%';
      $('hint').textContent='Поймано: '+(o.label||'деталь')+'!';
      if(caught.length>=GOAL)finish();
      return;
    }
  }
}

field.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const rect=field.getBoundingClientRect();
  catchAt(e.clientX-rect.left,e.clientY-rect.top);
},{passive:false});

function avgTraits(parts) {
  if(!parts.length)return {roundness:.5,spikiness:.3,elongation:1};
  const s={roundness:0,spikiness:0,elongation:0};
  parts.forEach(p=>{
    const t=p.traits||{};
    s.roundness+=t.roundness||.4;
    s.spikiness+=t.spikiness||.2;
    s.elongation+=t.elongation||1;
  });
  const n=parts.length;
  return {roundness:s.roundness/n, spikiness:s.spikiness/n, elongation:s.elongation/n};
}

function requestedScheme() {
  try {
    const q=(new URLSearchParams(location.search).get('scheme')||'').toLowerCase();
    if(['trex','t-rex','tRex','dino','tyrant','тираннозавр'].includes(q))return 'trex';
    if(['orb','cyclops','eye','shar','ball','одноглаз','один'].includes(q))return 'orb';
    if(['kraken','krak','octopus','кракен'].includes(q))return 'kraken';
  } catch(e){}
  return null;
}

function pickScheme(parts) {
  const forced=requestedScheme();
  if(forced)return forced;
  const a=avgTraits(parts);
  const w={
    trex: 1 + a.spikiness*0.9 + (a.elongation>1.25?0.25:0),
    orb:  1 + a.roundness*1.0 - a.spikiness*0.15,
    kraken:1 + Math.max(0,a.elongation-1)*0.8 + a.spikiness*0.2
  };
  const total=w.trex+w.orb+w.kraken;
  let x=Math.random()*total;
  if((x-=w.trex)<=0)return 'trex';
  if((x-=w.orb)<=0)return 'orb';
  return 'kraken';
}

function scorePart(p, want) {
  if(!want)return 0;
  const t=p.traits||{};
  let s=0;
  if(want.roundness!=null) s-=Math.abs((t.roundness||0)-want.roundness);
  if(want.spikiness!=null) s-=Math.abs((t.spikiness||0)-want.spikiness)*1.15;
  if(want.elongation!=null) s-=Math.abs((t.elongation||1)-want.elongation)*0.55;
  if(want.minSpike && (t.spikiness||0)>=want.minSpike) s+=.5;
  if(want.minElong && (t.elongation||1)>=want.minElong) s+=.5;
  if(want.minRound && (t.roundness||0)>=want.minRound) s+=.5;
  if(want.maxRound!=null && (t.roundness||0)<=want.maxRound) s+=.2;
  return s;
}

function takeBest(pool, want) {
  if(!pool.length)return null;
  let bi=0, bs=-1e9;
  pool.forEach((p,i)=>{
    const s=scorePart(p,want);
    if(s>bs){bs=s;bi=i;}
  });
  return pool.splice(bi,1)[0];
}

      {id:'tail', zone:'tail',  x:200, y:360, rot:2.75, scale:.8, z:8, rank:2, want:{elongation:1.5, minElong:1.2},
        chain:{max:4, min:1, curve:0.18, step:1.0}},
      {id:'back1',zone:'back', x:255, y:275, rot:-0.55, scale:.48, z:22, rank:3, want:{spikiness:.7, minSpike:.4}},
      {id:'back2',zone:'back', x:305, y:255, rot:-0.3, scale:.45, z:22, rank:4, want:{spikiness:.7, minSpike:.4}},
      {id:'back3',zone:'back', x:350, y:260, rot:-0.15, scale:.4, z:22, rank:5, want:{spikiness:.6}},

      {id:'hornL',zone:'back', x:245, y:250, rot:-0.45, scale:.5, z:24, rank:2, want:{spikiness:.7, minSpike:.35}},
      {id:'hornR',zone:'back', x:355, y:250, rot:0.45, scale:.48, z:24, rank:2, want:{spikiness:.7, minSpike:.35}},
      {id:'hornM',zone:'back', x:300, y:225, rot:0, scale:.46, z:25, rank:3, want:{spikiness:.6}},
      {id:'armL', zone:'limbs', x:185, y:365, rot:-0.2, scale:.52, z:14, rank:3, want:{elongation:1.4, minElong:1.15}},
      {id:'armR', zone:'limbs', x:415, y:365, rot:0.2, scale:.52, z:14, rank:3, want:{elongation:1.4, minElong:1.15}},
      {id:'legL', zone:'limbs', x:245, y:470, rot:0.1, scale:.58, z:12, rank:2, want:{elongation:1.3}},
      {id:'legR', zone:'limbs', x:355, y:470, rot:-0.1, scale:.58, z:12, rank:2, want:{elongation:1.3}},
      {id:'handL',zone:'limbs', x:155, y:410, rot:0, scale:.36, z:15, rank:5, want:{}},
      {id:'handR',zone:'limbs', x:445, y:410, rot:0, scale:.36, z:15, rank:5, want:{}},
      {id:'cheekL',zone:'decor',x:240, y:385, rot:0, scale:.36, z:21, rank:5, want:{roundness:.6}},
      {id:'cheekR',zone:'decor',x:360, y:385, rot:0, scale:.36, z:21, rank:5, want:{roundness:.6}},
      {id:'spot', zone:'decor',x:300, y:430, rot:0, scale:.34, z:21, rank:5, want:{roundness:.5}},
      {id:'hat',  zone:'decor',x:265, y:280, rot:-0.3, scale:.36, z:23, rank:5, want:{}}

  // kraken

  const slots=[

    {id:'crown2',zone:'back', x:300, y:105, rot:0, scale:.5, z:32, rank:3, want:{spikiness:.7, minSpike:.35}},
    {id:'crown3',zone:'back', x:350, y:125, rot:0.4, scale:.46, z:32, rank:4, want:{spikiness:.6}},
    {id:'sideL', zone:'decor', x:210, y:215, rot:-0.3, scale:.4, z:28, rank:5, want:{roundness:.5}},
    {id:'sideR', zone:'decor', x:390, y:215, rot:0.3, scale:.4, z:28, rank:5, want:{roundness:.5}}
  ];
  tentAngles.forEach((a,i)=>{
    slots.push({
      id:'tent'+i, zone:'limbs',
      x:300+Math.sin(a)*55, y:300+Math.abs(Math.sin(a))*10,
      rot:Math.PI/2+a*0.55, scale:.78, z:10+i,
      rank: i<5?2:4,
      want:{elongation:1.5, minElong:1.15},
      chain:{max: n>=10?3:2, min: n>=7?2:1, curve:(i%2?1:-1)*0.22, step:1.02}

  return slots;
}

function layoutParts(parts) {
  const W=creature.width, H=creature.height;
  const scheme=pickScheme(parts);
  const n=parts.length;
  const pool=parts.map((p,i)=>({...p, i, traits:p.traits?{...p.traits}:{roundness:.4,spikiness:.2,elongation:1,size:1}}));
  const slots=schemeSlots(scheme, n).sort((a,b)=>a.rank-b.rank);

  // Open only as many slots as we have parts, keeping low-rank (essential) first.
  // Chain slots can consume several parts.
  const assigned=[]; // {slot, pieces:[]}
  let remaining=n;
  for(const slot of slots){
    if(remaining<=0)break;
    const need = slot.chain
      ? Math.min(slot.chain.max, Math.max(slot.chain.min, remaining>=8?slot.chain.max:slot.chain.min))
      : 1;
    // skip high-rank slots if we must still cover later equal-or-lower? already sorted
    // if remaining is tight, skip rank>=4 until essentials filled — already order by rank
    if(slot.rank>=4 && remaining <= 0) break;
    const pieces=[];
    const count=slot.chain? Math.min(need, remaining) : 1;
    for(let k=0;k<count;k++){
      const p=takeBest(pool, slot.want);
      if(!p)break;
      pieces.push(p);
    }
    if(pieces.length){
      assigned.push({slot, pieces});
      remaining-=pieces.length;
    }
  }
  // leftovers: dump into extra decor around body/head
  const bodySlot=(assigned.find(a=>a.slot.zone==='body')||assigned.find(a=>a.slot.zone==='head')||assigned[0]);
  let extra=0;
  while(pool.length){
    const p=pool.shift();
    const ang=-0.9+extra*0.65, rad=70+ (extra%3)*16;
    const bx=bodySlot?bodySlot.slot.x:W/2, by=bodySlot?bodySlot.slot.y:H/2;
    assigned.push({
      slot:{id:'extra'+extra, zone:'decor', x:bx+Math.cos(ang)*rad, y:by+Math.sin(ang)*rad,
        rot:ang, scale:.42, z:18, rank:6, want:{}},
      pieces:[p]
    });
    extra++;
  }

  const laid=[];
  assigned.forEach((a,ai)=>{
    const sl=a.slot;
    const distort=0.82+hash01(ai+3, n+7)*0.4; // 0.82–1.22
    const baseR = Math.min(W,H)*0.11*sl.scale*distort*(n<=3?1.2:n<=7?1.08:1);
    if(sl.chain && a.pieces.length){
      let x=sl.x, y=sl.y, ang=sl.rot;
      a.pieces.forEach((p,k)=>{
        const r=baseR*(k===0?1:0.88-k*0.06)*(.85+hash01(p.i,13)*.3);
        if(k>0){
          ang += (sl.chain.curve||0.2);
          const prev=laid[laid.length-1];
          const dist=(prev.r+r)*(sl.chain.step||0.95);
          x+=Math.cos(ang)*dist; y+=Math.sin(ang)*dist;
        }
        laid.push({...p, x, y, r, angle:ang+(p.rot||0)*.15, z:sl.z-k, role:sl.id, zone:sl.zone});
      });
    } else {
      const p=a.pieces[0];
      const r=baseR*(.85+hash01(p.i,21)*.3);
      laid.push({...p, x:sl.x, y:sl.y, r, angle:sl.rot+(p.rot||0)*.12, z:sl.z, role:sl.id, zone:sl.zone});
    }
  });

  // Fit into canvas
  if(laid.length){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    laid.forEach(p=>{
      minX=Math.min(minX,p.x-p.r);maxX=Math.max(maxX,p.x+p.r);
      minY=Math.min(minY,p.y-p.r);maxY=Math.max(maxY,p.y+p.r);
    });
    const margin=40;
    const bw=Math.max(40,maxX-minX), bh=Math.max(40,maxY-minY);
    const scale=Math.min((W-2*margin)/bw,(H-2*margin)/bh,1.4);
    const midX=(minX+maxX)/2, midY=(minY+maxY)/2;
    laid.forEach(p=>{
      p.x=W/2+(p.x-midX)*scale;
      p.y=H/2+(p.y-midY)*scale;
      p.r=p.r*scale;
    });
  }

  // Factory googly eyes — not caught items
  const eyes=[];
  const head=laid.find(p=>p.zone==='head')||laid.find(p=>p.role==='head');
  const body=laid.find(p=>p.zone==='body')||laid.find(p=>p.role==='body')||laid[0];
  if(scheme==='orb'){
    const host=body||head||laid[0];
    if(host) eyes.push({x:host.x, y:host.y-host.r*.06, r:host.r*.42, look:1});
  } else if(scheme==='trex'){
    const host=head||body||laid[0];
    if(host){
      const ex=host.x+host.r*.12, ey=host.y-host.r*.18, er=host.r*.26;
      eyes.push({x:ex-er*.7, y:ey, r:er, look:1});
      eyes.push({x:ex+er*.75, y:ey+er*.05, r:er*.92, look:1});
    }
  } else {
    const host=head||body||laid[0];
    if(host){
      const ey=host.y-host.r*.08, er=host.r*.24;
      eyes.push({x:host.x-er*.85, y:ey, r:er, look:1});
      eyes.push({x:host.x+er*.85, y:ey, r:er, look:1});
    }
  }

  return {parts:laid, scheme, eyes, body:body||laid[0]};
}

function makeName(parts, scheme) {
  const a=avgTraits(parts);
  const hasZig=parts.some(p=>p.kind==='zigzag'||p.kind==='worm'||p.label==='зигзаг'||p.label==='молния'||p.type===7);
  const hasSpike=parts.some(p=>p.kind==='spiky'||p.type===3||(p.traits&&p.traits.spikiness>.75));
  let adj;
  if(a.spikiness>=.55 || hasSpike) adj=pick(['Колючий','Игольчатый','Зубастый']);
  else if(hasZig || a.elongation>=1.55) adj=pick(['Кривой','Зигзаговый','Червячный']);
  else if(a.roundness>=.7) adj=pick(['Пухлый','Круглый','Шаровидный']);
  else if(parts.some(p=>p.kind==='lumpy'||p.kind==='blob')) adj=pick(['Бугристый','Корявый','Странный']);
  else adj=pick(['Странный','Абсурдный','Кривой']);

  if(scheme==='kraken'){
    if(adj==='Зигзаговый' || (hasZig && a.elongation>1.4)) return 'Зигзагокракен';
    return adj+' кракен';
  }
  if(scheme==='orb'){
    if(adj==='Кривой') return 'Кривой одноглаз';
    return adj+' одноглаз';
  }
  return adj+' тираннозавр';
}

function drawGoogly(c, x, y, r, t, reduced) {
  const look= reduced?0.12: Math.sin((t||0)/700)*0.18;
  c.save();
  c.fillStyle='#fffdf7';
  c.strokeStyle='#1c2836';
  c.lineWidth=Math.max(2,r*.1);
  c.beginPath();c.ellipse(x,y,r,r*1.06,0,0,Math.PI*2);c.fill();c.stroke();
  const px=x+r*look, py=y+r*.12;
  c.fillStyle='#1a2430';
  c.beginPath();c.arc(px,py,r*.45,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.arc(px+r*.14,py-r*.16,r*.15,0,Math.PI*2);c.fill();
  c.restore();
}

function finish() {
  if(!running)return;
  running=false;
  cancelAnimationFrame(raf);
  $('hud').classList.add('hidden');
  $('result').classList.remove('hidden');

  const layout=layoutParts(caught);
  const parts=layout.parts;
  const scheme=layout.scheme;
  $('creatureName').textContent=makeName(caught, scheme);
  $('creatureDesc').textContent=
    'Поймано деталей: '+caught.length+'. Все детали — твоя добыча!';
  $('rarity').textContent=caught.length>=13?'редкий экземпляр':
    caught.length>=8?'необычный экземпляр':'первое поколение';

  $('legend').replaceChildren();
  caught.forEach(p=>{
    const dot=document.createElement('span');
    dot.className='dot';dot.style.background=p.color;
    dot.title=p.label||'';$('legend').appendChild(dot);
  });

  cancelAnimationFrame(resultRaf);
  const t0=performance.now();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const duration=reduced?0:950;
  const body=layout.body||parts[0];

  function draw(now) {
    const W=creature.width,H=creature.height;
    const progress=Math.min(1,(now-t0)/duration||1);
    cc.clearRect(0,0,W,H);
    const bg=cc.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#fffaf0');bg.addColorStop(1,'#f0dfc7');
    cc.fillStyle=bg;cc.fillRect(0,0,W,H);

    const assembled=progress>=1;
    const breath=(!reduced&&assembled)?1+Math.sin((now-t0)/650)*.03:1;
    const wobble=(!reduced&&assembled)?Math.sin((now-t0)/900)*.045:0;
    const bx=body?body.x:W/2, by=body?body.y:H/2;

    const ordered=parts.slice().sort((a,b)=>a.z-b.z);
    ordered.forEach((p,i)=>{
      const delay=(p.i!=null?p.i:i)*35;
      const t=Math.max(0,Math.min(1,(now-t0-delay)/(duration||1)));
      const ease=1-Math.pow(1-t,3);
      const sx=W/2, sy=H+50;
      let x=sx+(p.x-sx)*ease;
      let y=sy+(p.y-sy)*ease;
      let r=p.r, ang=p.angle||0;
      if(assembled&&!reduced){
        x=bx+(p.x-bx)*breath;
        y=by+(p.y-by)*breath+Math.sin((now-t0)/500+i)*.028*p.r;
        r=p.r*breath;
        ang=ang+wobble*(i%2?1:-.7);
      } else if(assembled&&reduced){
        x=p.x;y=p.y;
      }
      drawToken(cc,p,x,y,r,ang);
    });

    const eyeT=reduced?1:Math.max(0, Math.min(1, (now-t0-(duration*.7))/400));
    if(eyeT>0 && layout.eyes){
      layout.eyes.forEach((e,i)=>{
        let ex=e.x, ey=e.y, er=e.r*eyeT;
        if(assembled&&!reduced){
          ex=bx+(e.x-bx)*breath;
          ey=by+(e.y-by)*breath;
          er=e.r*breath*eyeT;
        }
        drawGoogly(cc, ex, ey, er, now-t0+i*200, reduced);
      });
    }

    $('animationNote').textContent=progress<1?
      'Детали собираются вместе…':'Готово! Оно живое?!';

    if(progress<1||!reduced)resultRaf=requestAnimationFrame(draw);
  }
  resultRaf=requestAnimationFrame(draw);
}

function start() {
  cancelAnimationFrame(raf);
  cancelAnimationFrame(resultRaf);
  cancelAnimationFrame(introRaf);
  targets=[];sparks=[];caught=[];
  elapsed=0;spawnClock=0;running=true;
  $('score').textContent='0';
  $('timer').textContent=ROUND;
  $('meter').style.width='0%';
  $('hint').textContent='Лови детали — собери своего монстра!';
  $('animationNote').textContent='Собираем твоего монстра…';
  $('intro').classList.add('hidden');
  $('result').classList.add('hidden');
  $('hud').classList.remove('hidden');
  for(let i=0;i<7;i++)spawn();
  last=performance.now();
  render();
  raf=requestAnimationFrame(frame);
}

$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);

// ----- intro title screen -----
function resizeIntro() {
  if(!introCanvas)return;
  const rect=introCanvas.getBoundingClientRect();
  introW=Math.max(1,rect.width);introH=Math.max(1,rect.height);
  introDpr=Math.min(window.devicePixelRatio||1,2);
  introCanvas.width=Math.round(introW*introDpr);
  introCanvas.height=Math.round(introH*introDpr);
  ic.setTransform(introDpr,0,0,introDpr,0,0);
}

function initFloaters() {
  introFloaters=[];
  for(let i=0;i<7;i++){
    introFloaters.push({
      x:rand(.08,.92), y:rand(.12,.88),
      vx:rand(-.025,.025), vy:rand(-.02,.02),
      r:rand(16,26), type:Math.floor(Math.random()*15),
      color:pick(colors), rot:rand(0,6.28), spin:rand(-.6,.6),
      phase:rand(0,6.28)
    });
  }
}

function drawIntroMascot(c,x,y,s,t) {
  const bob=Math.sin(t*2.1)*Math.min(14,s*.08);
  const tilt=Math.sin(t*1.25)*.06;
  c.save();c.translate(x,y+bob);c.rotate(tilt);
  drawToken(c,{type:0,color:'#ffd16d'},-s*.72,-s*.62,s*.42, -.15);
  drawToken(c,{type:0,color:'#70d4b4'}, s*.74,-s*.56,s*.38,  .18);
  drawToken(c,{type:0,color:'#75c5f2'}, s*.04,-s*.95,s*.24, 0);
  drawToken(c,{type:0,color:'#ff715f'}, 0, 0, s, 0);
  drawToken(c,{type:15,color:'#fff6e8'},-s*.34,-s*.10,s*.32, 0);
  drawToken(c,{type:15,color:'#fff6e8'}, s*.36,-s*.08,s*.32, 0);
  drawToken(c,{type:17,color:'#70d4b4'}, 0, s*.32,s*.36, 0);
  c.restore();
}

function drawIntro(t,reduced) {
  ic.clearRect(0,0,introW,introH);
  introFloaters.forEach(f=>{
    if(!reduced){
      f.x+=f.vx*0.016;f.y+=f.vy*0.016;f.rot+=f.spin*0.016;
      if(f.x<-.1)f.x=1.1;if(f.x>1.1)f.x=-.1;
      if(f.y<-.1)f.y=1.1;if(f.y>1.1)f.y=-.1;
    }
    const px=f.x*introW, py=f.y*introH;
    ic.globalAlpha=.55;
    drawToken(ic,f,px,py,f.r,f.rot);
    ic.globalAlpha=1;
  });
  const stage=$('introStage').getBoundingClientRect();
  const root=introCanvas.getBoundingClientRect();
  const mx=stage.left-root.left+stage.width/2;
  const my=stage.top-root.top+stage.height/2;
  const s=Math.min(stage.width,stage.height)*.34;
  drawIntroMascot(ic,mx,my,Math.max(70,s), reduced?0:t);
}

function startIntro() {
  cancelAnimationFrame(introRaf);
  initFloaters();
  resizeIntro();
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0=performance.now();
  function loop(now){
    if($('intro').classList.contains('hidden'))return;
    drawIntro(reduced?0:(now-t0)/1000,reduced);
    introRaf=requestAnimationFrame(loop);
  }
  drawIntro(0,reduced);
  introRaf=requestAnimationFrame(loop);
}

startIntro();

})();
</script>
